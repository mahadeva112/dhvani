name: Release

# Builds the desktop installers and the zip distributions when a version tag is
# pushed, then publishes them as a GitHub release. Publishing is what makes the
# installed apps see the update, so a tag push is the whole release:
#
#   npm run release          # bumps the patch version, tags, pushes
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            command: npm run dist:win
          - os: macos-latest
            label: macOS disk image
            command: npm run dist:mac
          - os: ubuntu-latest
            label: Linux AppImage
            command: npm run dist:linux

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build installer
        run: ${{ matrix.command }}
        env:
          # Unsigned builds. Add signing credentials here when you have them:
          # CSC_LINK / CSC_KEY_PASSWORD for macOS and Windows code signing.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: dhvani-${{ matrix.os }}
          # latest*.yml and the blockmaps are what the installed app's updater
          # reads; without them a published release is invisible to it.
          path: |
            release/*.exe
            release/DHVANI-*.zip
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  zip:
    name: Portable zip
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run dist:zip

      - uses: actions/upload-artifact@v7
        with:
          name: dhvani-portable
          path: release/*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, zip]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # One publish per tag at a time (a rerun waits for a running one). Different
    # tags still publish side by side; the script settles which one is Latest.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # Only the script is needed, not the whole repository.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Creates (or reuses) a draft, uploads and checks all 13 files, then
      # publishes it and marks the highest vX.Y.Z release Latest. Published,
      # not left a draft: the updater ignores drafts, and this is the step that
      # offers the new version to installed copies. See the script for why
      # this is no longer softprops/action-gh-release.
      - name: Publish release
        run: bash .github/scripts/publish-release.sh artifacts
        env:
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 3 latest*.yml, Setup .exe + blockmap, 2 .dmg + blockmaps, AppImage,
          # Portable .zip and .exe, and the dhvani-x.y.z.zip bundle.
          MIN_FILES: 13

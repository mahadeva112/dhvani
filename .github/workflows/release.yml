name: Release

# Builds the desktop installers and the zip distributions when a version tag is
# pushed, then publishes them as a GitHub release. Publishing is what makes the
# installed apps see the update, so a tag push is the whole release:
#
#   npm run release          # bumps the patch version, tags, pushes
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            command: npm run dist:win
          - os: macos-latest
            label: macOS disk image
            command: npm run dist:mac
          - os: ubuntu-latest
            label: Linux AppImage
            command: npm run dist:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build installer
        run: ${{ matrix.command }}
        env:
          # Unsigned builds. Add signing credentials here when you have them:
          # CSC_LINK / CSC_KEY_PASSWORD for macOS and Windows code signing.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: dhvani-${{ matrix.os }}
          # latest*.yml and the blockmaps are what the installed app's updater
          # reads; without them a published release is invisible to it.
          path: |
            release/*.exe
            release/DHVANI-*.zip
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  zip:
    name: Portable zip
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run dist:zip

      - uses: actions/upload-artifact@v4
        with:
          name: dhvani-portable
          path: release/*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, zip]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Published, not a draft: the updater ignores drafts, and this is
          # the step that offers the new version to installed copies.
          draft: false
          make_latest: true
          generate_release_notes: true
          files: artifacts/*

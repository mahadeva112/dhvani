<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="1024" height="1024">
  <!-- Dhvani logo (E3): five white sound-wave bars on an indigo-to-purple tile.
       Render to icon-source.png at 1024px (transparent corners), then npm run icon. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B5BF7"/>
      <stop offset="1" stop-color="#B026FF"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#tile)"/>
  <g stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M22 41 v14"/>
    <path d="M35 29 v38"/>
    <path d="M48 18 v60"/>
    <path d="M61 31 v34"/>
    <path d="M74 42 v12"/>
  </g>
</svg>

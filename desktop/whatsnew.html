<!doctype html>
<!--
  Help → What's New (desktop/main.cjs). Each version's changes in short lines,
  read from whatsnew.js, so it works offline and opens no web page.
  The running version arrives in the query string.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>What’s New in DHVANI</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        background: #0f172a;
        color: #cbd5e1;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.55;
        display: flex;
        flex-direction: column;
        cursor: default;
      }
      header { padding: 18px 24px 12px; border-bottom: 1px solid #1e293b; }
      h1 { margin: 0; font-size: 17px; font-weight: 600; color: #f1f5f9; }
      header p { margin: 2px 0 0; color: #94a3b8; font-size: 12.5px; }
      main { flex: 1; overflow-y: auto; padding: 6px 24px 10px; }
      main::-webkit-scrollbar { width: 8px; }
      main::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
      section { padding: 10px 0; border-bottom: 1px solid #1e293b; }
      section:last-child { border-bottom: 0; }
      h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #e2e8f0; font-family: Consolas, ui-monospace, monospace; }
      .badge { margin-left: 8px; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; color: #a5b4fc; background: #312e81; border-radius: 999px; padding: 1px 8px; }
      ul { margin: 0; padding-left: 18px; }
      li { margin: 1px 0; user-select: text; }
      footer { display: flex; padding: 12px 24px; border-top: 1px solid #1e293b; }
      button {
        margin-left: auto;
        background: #4f46e5;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 7px 22px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: #6366f1; }
      button:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>What’s New</h1>
      <p id="installed"></p>
    </header>
    <main id="list"></main>
    <footer>
      <button id="ok" type="button" autofocus>Close</button>
    </footer>
    <script src="whatsnew.js"></script>
    <script>
      const current = new URLSearchParams(location.search).get('version') || '';
      const parts = (v) => String(v).split('.').map((n) => Number(n) || 0);
      const notNewer = (v) => {
        const [a, b] = [parts(v), parts(current)];
        for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] < b[i];
        return true;
      };

      if (current) document.getElementById('installed').textContent = `You have version ${current}`;
      const list = document.getElementById('list');
      for (const entry of (window.WHATS_NEW || []).filter((e) => !current || notNewer(e.version))) {
        const section = document.createElement('section');
        const title = document.createElement('h2');
        title.textContent = entry.version;
        if (entry.version === current) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = 'Installed';
          title.appendChild(badge);
        }
        const ul = document.createElement('ul');
        for (const change of entry.changes) {
          const li = document.createElement('li');
          li.textContent = change;
          ul.appendChild(li);
        }
        section.append(title, ul);
        list.appendChild(section);
      }

      document.getElementById('ok').addEventListener('click', () => window.close());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') window.close();
      });
    </script>
  </body>
</html>

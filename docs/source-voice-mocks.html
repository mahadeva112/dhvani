<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Source Voice Mocks</title>
<script src="https://cdn.tailwindcss.com/3.4.10"></script>
<script>
  // Graphite, as index.css swaps it.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          slate: { 50:'#f6f6f7',100:'#ececef',200:'#dcdde1',300:'#c6c8ce',400:'#abadb5',500:'#8b8e98',600:'#5a5d66',700:'#34363c',800:'#232529',900:'#18191c',950:'#111214' },
          indigo: { 300:'#a5adf5',400:'#7b86ec',500:'#5866e0',600:'#4c59d0',950:'#23253a' },
          edge: '#27292d',
        },
      },
    },
  };
</script>
<style>
  html, body { overflow-x: clip; }
  body { background:#111214; font-family: Inter, system-ui, "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .scroll::-webkit-scrollbar { width:8px } .scroll::-webkit-scrollbar-thumb { background:#34363c; border-radius:8px } .scroll::-webkit-scrollbar-track { background:transparent }
  .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg) } }
  .sw { width:30px; height:17px; border-radius:999px; background:#34363c; position:relative; flex-shrink:0; transition:background .15s; display:inline-block; }
  .sw::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#ececef; transition:left .15s; }
  .sw.on { background:#5866e0; } .sw.on::after { left:15px; }
  .pop { box-shadow: 0 24px 60px -12px rgba(0,0,0,.8); }
  .rng { -webkit-appearance:none; appearance:none; width:100%; height:18px; background:transparent; }
  .rng::-webkit-slider-runnable-track { height:4px; border-radius:4px; background:linear-gradient(to right,#5866e0 0,#5866e0 var(--p),#34363c var(--p)); }
  .rng::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; margin-top:-5px; border-radius:50%; background:#ececef; border:2px solid #5866e0; }
  .eq span { display:inline-block; width:2px; margin:0 .5px; background:currentColor; border-radius:1px; animation: eq .9s ease-in-out infinite; }
  .eq span:nth-child(2) { animation-delay:.2s } .eq span:nth-child(3) { animation-delay:.4s }
  @keyframes eq { 0%,100% { height:4px } 50% { height:12px } }
  select, button { cursor:default; }
</style>
</head>
<body class="text-slate-100 min-h-screen p-4 sm:p-6">

<div class="max-w-[90rem] mx-auto mb-2 flex flex-wrap items-center gap-2 text-[12.5px] text-slate-400">
  <span class="px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-300 font-medium">Mock</span>
  <span id="mockSeg" class="inline-flex flex-wrap rounded-lg border border-edge overflow-hidden"></span>
</div>
<div class="max-w-[90rem] mx-auto mb-2 flex flex-wrap items-center gap-2 text-[12.5px] text-slate-400">
  <span class="px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-medium">অবস্থা</span>
  <span id="stateSeg" class="inline-flex flex-wrap rounded-lg border border-edge overflow-hidden"></span>
</div>
<p id="note" class="max-w-[90rem] mx-auto mb-4 text-[13.5px] text-slate-300 leading-relaxed"></p>

<div class="max-w-[90rem] mx-auto">
  <!-- App bar, for context -->
  <div class="flex flex-wrap items-center gap-2 mb-3 text-[13px] min-h-[36px]">
    <span class="font-semibold text-slate-100 mr-2">Dhvani</span>
    <span class="text-slate-100 font-semibold">1 Source &amp; voice</span><span class="text-slate-600">›</span>
    <span class="text-slate-500">2 Review</span><span class="text-slate-600">›</span>
    <span class="text-slate-500">3 Dub</span>
    <div class="flex-1"></div>
    <button class="h-8 px-2.5 rounded-lg border border-edge bg-slate-900 hover:bg-slate-800 text-[12.5px] text-slate-200" title="Voice changer, Text to speech and more">Tools</button>
  </div>
  <div id="main"></div>
</div>
<div id="overlay"></div>

<script>
const ICON = {
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
  film: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/>',
  swap: '<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  pause: '<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  chevR: '<path d="m9 18 6-6-6-6"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  spin: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  sliders: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  list: '<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
};
const ic = (n, c = 'w-4 h-4') => `<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

// Voices: id, name, gender, accent, style, speaks target language, hue
const VOICES = [
  ['priya','Priya','Female','Indian','Narration',true,262],
  ['arjun','Arjun','Male','Indian','Conversational',true,190],
  ['meera','Meera','Female','Indian','Calm',true,330],
  ['raghav','Raghav','Male','Indian','Deep, warm',true,30],
  ['ananya','Ananya','Female','Indian','Young, bright',true,150],
  ['kabir','Kabir','Male','Indian','Storyteller',true,210],
  ['leela','Leela','Female','Indian','Soft',false,290],
  ['vikram','Vikram','Male','Indian','News',false,0],
  ['sara','Sara','Female','American','Conversational',false,170],
  ['james','James','Male','British','Narration',false,45],
  ['nisha','Nisha','Female','Indian','Teacher',true,310],
  ['dev','Dev','Male','Indian','Podcast',true,100],
];
const RATE = { priya: 4.6, arjun: 5.1, meera: 4.2, raghav: 4.4, ananya: 5.4, kabir: 4.0, nisha: 4.8, dev: 5.0 };
const LANGS = ['Hindi','Bangla','Tamil','Telugu','Marathi','Gujarati','Kannada','Malayalam','English'];

const MOCKS = {
  A: { label: 'Mock A · বাঁয়ে ১-২-৩ ধাপ, ডানে voice তালিকা', note: 'বাঁয়ে তিনটে নম্বর দেওয়া কার্ড — 1 File, 2 Language & speakers, 3 Voice — তার নিচে Transcribe। ডানে voice library, কিন্তু grid নয়, এক সারির তালিকা: ▶ শুনে "Use" চাপো। Pause detection "More options"-এ লুকোনো। Voice changer / Text to speech উপরের Tools-এ, এই পাতায় নেই।' },
  B: { label: 'Mock B · উপরে এক সারির setup, নিচে বড় library', note: 'উপরের এক সারিতেই সব setup: ফাইল + wave, Spoken in ⇄ Dub into, Speakers, Options, আর Transcribe। নিচে পুরো জায়গা voice বাছার: বাঁয়ে filter-গুলো সবসময় খোলা (More filters লুকোনো নেই), মাঝে voice grid, ডানে বাছা voice-এর কার্ড — Hindi-তে নমুনা শোনা আর গতি।' },
  C: { label: 'Mock C · ধাপে ধাপে, ছোট shortlist', note: 'ফাইল না থাকলে বড় drop জায়গা + সাম্প্রতিক project। ফাইল এলে দুই কলাম: বাঁয়ে ফাইল শোনা আর ভাষা/speaker; ডানে Hindi বলে এমন ৬টা বাছাই করা voice বড় কার্ডে। বাকি সব voice "Browse all voices"-এ মাঝখানের window-তে খোলে। সবচেয়ে কম ভিড়।' },
  D: { label: 'Mock D · মাঝখানে একটা ফর্ম', note: 'macOS setup-এর মতো মাঝখানে এক কলাম: File, Language, Speakers, Voice — প্রতিটা এক সারি, বাঁয়ে নাম আর ছোট ব্যাখ্যা। Voice-এ শুধু বাছা voice দেখায়; "Change" চাপলে ওখানেই ৬টা voice খোলে (radio + ▶), আরও চাইলে "Search all voices" মাঝখানের window। নিচে Transcribe সবসময় দেখা যায়, সঙ্গে এক লাইনে সারাংশ।' },
  E: { label: 'Mock E · বড় player, ডানে inspector', note: 'DaVinci-র মতো: বাঁয়ে বড় player (ভিডিও + wave), তার নিচে speaker-রঙের দাগ। ডানে inspector-এ তিনটে tab — Source, Voice, Options — প্রতিটা tab-এর নিচে এখন কী বাছা আছে লেখা। Transcribe inspector-এর নিচে সবসময়। ফাইল শুনে-দেখে তবে setup।' },
  F: { label: 'Mock F · voice পাশাপাশি তুলনা', note: 'বাঁয়ে সরু কলামে ফাইল, ভাষা, speaker আর Transcribe। মাঝের বড় জায়গায় ৩টে voice পাশাপাশি — সবাই একই Hindi লাইন পড়ে, গতি একটা দাগে দেখায় (দ্রুত হলে লম্বা লাইনে জায়গা হয়)। "Use" চাপলে সেটা বাছা। নিচে আরও voice "Add to compare"-এ যোগ করা যায়, "Play all three" একটার পর একটা বাজায়।' },
};
const STATES = { empty: 'ফাইল নেই', loaded: 'ফাইল আছে', multi: 'একাধিক speaker', transcribing: 'Transcribe চলছে' };

const S = { mock: 'A', state: 'loaded', src: '', lang: 'Hindi', voice: 'priya', playing: null, engine: 'elevenlabs', speakers: 1, gender: 'all', indian: true, fav: false, more: false, q: '', browse: false, opts: false, sens: 50, expand: false, tab: 'source', cmp: ['priya', 'arjun', 'kabir'] };
try { const saved = JSON.parse(localStorage.getItem('sourceVoiceMock') || '{}'); if (saved.mock) S.mock = saved.mock; } catch {}

const hasFile = () => S.state !== 'empty';
const busy = () => S.state === 'transcribing';
const multi = () => S.speakers !== 1;
const voice = () => VOICES.find((v) => v[0] === S.voice);
const shown = () => VOICES.filter((v) => (S.gender === 'all' || v[2].toLowerCase() === S.gender) && (!S.indian || v[3] === 'Indian') && (!S.q || v.slice(1, 5).join(' ').toLowerCase().includes(S.q.toLowerCase())))
  .sort((a, b) => Number(b[5]) - Number(a[5]));

// ---------- shared pieces ----------
const avatar = (v, size = 'w-9 h-9 text-[13px]') => `<span class="${size} rounded-full flex items-center justify-center font-semibold shrink-0" style="background:hsl(${v[6]} 45% 26%);color:hsl(${v[6]} 80% 82%)">${v[1][0]}</span>`;
const playBtn = (v, cls = 'w-8 h-8') => {
  const on = S.playing === v[0];
  return `<button data-act="play" data-v="${v[0]}" title="${on ? 'Stop preview' : `Play ${v[1]} preview`}" class="${cls} rounded-full flex items-center justify-center shrink-0 ${on ? 'bg-indigo-500 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}">${on ? '<span class="eq flex items-center h-3"><span></span><span></span><span></span></span>' : ic('play', 'w-3.5 h-3.5 ml-0.5')}</button>`;
};
const tag = (t, tone = 'grey') => `<span class="text-[10.5px] px-1.5 py-px rounded ${tone === 'green' ? 'bg-emerald-500/15 text-emerald-300' : 'bg-slate-800 text-slate-400'}">${t}</span>`;

function sel(id, value, options, cls = '', disabled = false) {
  return `<div class="relative ${cls}">
    <select data-act="${id}" ${disabled ? 'disabled' : ''} class="appearance-none w-full h-10 bg-slate-950 border border-edge hover:border-slate-600 rounded-xl pl-3 pr-9 text-[13px] font-medium text-slate-100 focus:outline-none focus:border-indigo-500 disabled:opacity-60">
      ${options.map(([v, l]) => `<option value="${v}" ${v === value ? 'selected' : ''} class="bg-slate-900">${l}</option>`).join('')}
    </select>
    <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-500">${ic('chev')}</span>
  </div>`;
}
const srcSel = (cls) => sel('src', S.src, [['', 'Auto detect'], ...LANGS.map((l) => [l, l])], cls, busy());
const dstSel = (cls) => sel('lang', S.lang, LANGS.map((l) => [l, l]), cls, busy());
const swapBtn = `<button ${busy() || !S.src ? 'disabled' : ''} title="Swap languages" class="w-9 h-10 flex items-center justify-center rounded-xl border border-edge text-slate-400 hover:text-slate-100 hover:bg-slate-800 disabled:opacity-40">${ic('swap')}</button>`;

function langPair(stack = false) {
  return `<div class="grid grid-cols-[1fr_auto_1fr] items-end gap-2">
    <label class="flex flex-col gap-1.5 min-w-0"><span class="text-xs text-slate-400">Spoken in</span>${srcSel('')}</label>
    ${swapBtn}
    <label class="flex flex-col gap-1.5 min-w-0"><span class="text-xs text-slate-400">Dub into</span>${dstSel('')}</label>
  </div>`;
}

function speakerSeg(size = 'h-8') {
  const opts = [[1, '1'], [2, '2'], [3, '3'], [4, '4+'], [0, 'Not sure']];
  return `<div class="flex bg-slate-950 border border-edge rounded-xl p-0.5 gap-0.5">${opts.map(([n, l]) =>
    `<button data-act="spk" data-n="${n}" ${busy() ? 'disabled' : ''} class="${size} px-2.5 rounded-lg text-[12.5px] font-medium ${S.speakers === n ? 'bg-slate-800 text-slate-100' : 'text-slate-400 hover:text-slate-200'}">${l}</button>`).join('')}</div>`;
}

function engineSeg() {
  return `<div class="flex bg-slate-950 border border-edge rounded-xl p-0.5 gap-0.5">${[['elevenlabs', 'ElevenLabs'], ['cartesia', 'Cartesia']].map(([id, l]) =>
    `<button data-act="engine" data-e="${id}" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${S.engine === id ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-slate-200'}">${l}</button>`).join('')}</div>`;
}

function wave(n = 160, h = 'h-10', played = 0) {
  let out = '', seed = 11;
  for (let i = 0; i < n; i++) {
    seed = (seed * 9301 + 49297) % 233280;
    const r = seed / 233280;
    const gap = (i % 37) > 33;
    out += `<span class="flex-1 rounded-sm ${i < played ? 'bg-slate-300' : 'bg-cyan-400/60'}" style="height:${gap ? 6 : 20 + r * 75}%"></span>`;
  }
  return `<div class="${h} flex items-center gap-[1.5px]">${out}</div>`;
}

function fileBlock({ compact = false } = {}) {
  if (!hasFile()) {
    return `<button class="w-full rounded-xl border-[1.5px] border-dashed border-slate-700 hover:border-indigo-500/70 px-4 py-5 flex flex-col items-center gap-2 text-center">
      <span class="w-10 h-10 rounded-xl bg-indigo-500/15 text-indigo-300 flex items-center justify-center">${ic('upload', 'w-5 h-5')}</span>
      <span class="text-[13.5px] font-semibold text-slate-100">Drop audio or video, or <span class="text-indigo-300 border-b border-indigo-400/50">browse</span></span>
      <span class="text-[11.5px] text-slate-500">WAV · MP3 · M4A · FLAC · MP4 · MOV · MKV</span>
      <span class="mt-1 flex items-center gap-1.5 text-[11.5px] text-slate-500">Try a sample <span class="px-2 py-0.5 rounded-md border border-edge text-slate-300">Podcast</span><span class="px-2 py-0.5 rounded-md border border-edge text-slate-300">Keynote</span></span>
    </button>`;
  }
  return `<div class="flex flex-col gap-2.5">
    <div class="flex items-center gap-3">
      <span class="w-10 h-10 rounded-xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center">${ic('film', 'w-5 h-5')}</span>
      <div class="min-w-0 flex-1">
        <div class="text-[13.5px] font-semibold text-slate-100 truncate">sadhguru_energy_talk.mp4</div>
        <div class="text-[11.5px] mono text-slate-400">12:48 · 48 kHz stereo · 214 MB</div>
      </div>
      <button ${busy() ? 'disabled' : ''} class="px-2.5 py-1 rounded-lg border border-edge bg-slate-950 hover:bg-slate-800 text-xs font-semibold text-slate-200 disabled:opacity-40">Replace</button>
    </div>
    ${compact ? '' : `<div class="flex items-center gap-2.5">
      <button class="w-7 h-7 rounded-full bg-slate-100 text-slate-900 flex items-center justify-center">${ic('play', 'w-3 h-3 ml-0.5')}</button>
      <div class="flex-1 min-w-0">${wave(120, 'h-8')}</div>
    </div>`}
  </div>`;
}

function rateLine(v) {
  const r = RATE[v[0]];
  if (!r) return `<span class="text-[11.5px] text-slate-500">Speed is measured once it reads its ${S.lang} sample.</span>`;
  return `<span class="flex items-center gap-1.5 text-[11.5px] text-slate-400">${ic('gauge', 'w-3.5 h-3.5 text-slate-500')}Speaks ${S.lang} at <b class="mono text-slate-200 font-semibold">${r.toFixed(1)}</b> syllables/s</span>`;
}

function multiNote() {
  if (!multi()) return '';
  const n = S.speakers || 0;
  return `<div class="flex flex-col gap-1.5 pt-1">
    ${n ? Array.from({ length: n }, (_, i) => `<div class="flex items-center gap-2 text-[12.5px] text-slate-300"><span class="w-2 h-2 rounded-full" style="background:hsl(${[250, 170, 30, 330][i % 4]} 70% 65%)"></span>Speaker ${i + 1}<span class="ml-auto text-[11px] text-slate-500">Main voice</span></div>`).join('') : ''}
    <p class="text-[11px] text-slate-500 leading-snug">${n ? 'After transcribing you see who speaks most, and give each their own voice.' : 'Speakers are found when the file is transcribed.'}</p>
  </div>`;
}

function transcribeFooter() {
  if (busy()) {
    return `<div class="flex flex-col gap-2" role="status">
      <div class="flex items-center gap-2 text-[13px] text-slate-200">${ic('spin', 'w-4 h-4 spin text-indigo-300')}Transcribing · uploading audio<span class="ml-auto mono text-slate-400">38%</span></div>
      <div class="h-1.5 rounded-full bg-slate-800 overflow-hidden"><div class="h-full bg-indigo-500" style="width:38%"></div></div>
      <button class="h-9 flex items-center justify-center gap-2 rounded-xl border border-slate-700 hover:bg-slate-800 text-[13px] text-slate-200">${ic('x')}Cancel transcription</button>
    </div>`;
  }
  return `<button ${hasFile() ? '' : 'disabled'} class="h-11 w-full flex items-center justify-center gap-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold disabled:bg-slate-800 disabled:text-slate-500 active:translate-y-px">

    </button>

      <div class="rounded-xl bg-slate-900 border border-edge p-3 flex flex-col gap-2">

        : `<button data-act="pick" data-v="${x[0]}" class="mt-auto h-9 rounded-xl border border-edge bg-slate-900 hover:bg-slate-800 text-[13px] font-medium text-slate-100">Use ${x[1]}</button>`}

  const rail = `<aside class="bg-slate-900/90 border border-edge rounded-2xl flex flex-col overflow-hidden">
    <div class="p-4 border-b border-edge">${fileBlock({ compact: true })}</div>
    <div class="p-4 border-b border-edge flex flex-col gap-3">${langPair()}
      <div class="flex items-center justify-between gap-2"><span class="text-[12.5px] text-slate-300">Speakers</span>${speakerSeg('h-7')}</div>${multiNote()}
      <button data-act="more" class="self-start flex items-center gap-1 text-[12px] text-slate-400 hover:text-slate-200">${ic(S.more ? 'chev' : 'chevR', 'w-3.5 h-3.5')}More options</button>
      ${S.more ? `<div class="flex flex-col gap-1"><div class="flex justify-between text-[12px]"><span class="text-slate-300">Pause detection</span><span class="mono text-slate-400">${S.sens}</span></div><input data-act="sens" type="range" min="0" max="100" value="${S.sens}" class="rng" style="--p:${S.sens}%" /></div>` : ''}
    </div>
    <div class="mt-auto p-4 flex flex-col gap-2">${transcribeFooter()}</div>

  const main = `<section class="bg-slate-900/90 border border-edge rounded-2xl flex flex-col overflow-hidden">

      <button class="h-8 px-3 rounded-lg border border-edge bg-slate-950 hover:bg-slate-800 text-[12.5px] text-slate-200 flex items-center gap-1.5">${ic('play', 'w-3 h-3')}Play all three</button>
      ${engineSeg()}
    </div>
    <div class="px-5 pb-4 grid grid-cols-1 md:grid-cols-3 gap-3">${slots.join('')}</div>

  return `<div data-act="closeBrowse" class="fixed inset-0 z-40 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-6">

      <div class="flex items-center gap-3 px-5 py-4 border-b border-edge"><h2 class="text-[16px] font-semibold flex-1">All voices</h2>${engineSeg()}<button data-act="closeBrowse" class="w-8 h-8 rounded-lg border border-edge flex items-center justify-center text-slate-400 hover:bg-slate-800">${ic('x')}</button></div>
      <div class="flex flex-wrap items-center gap-2 px-5 py-3 border-b border-edge">${filters()}</div>
      <div class="flex-1 min-h-0 overflow-y-auto scroll p-2">${shown().map((x) => `
        <div class="flex items-center gap-3 px-3 py-2 rounded-xl ${x[0] === S.voice ? 'bg-indigo-500/10' : 'hover:bg-slate-800/50'}">
          ${playBtn(x)}${avatar(x, 'w-8 h-8 text-[12px]')}
          <div class="min-w-0 flex-1"><div class="text-[13.5px] font-semibold text-slate-100">${x[1]} ${x[5] ? tag(`Speaks ${S.lang}`, 'green') : ''}</div><div class="text-[11.5px] text-slate-500">${x[2]} · ${x[3]} · ${x[4]}</div></div>
          ${x[0] === S.voice ? `<span class="text-[12px] text-indigo-300 font-semibold px-3">Picked</span>` : `<button data-act="pick" data-v="${x[0]}" data-close="1" class="h-8 px-3 rounded-lg border border-edge hover:bg-slate-800 text-[12px]">Use</button>`}
        </div>`).join('')}</div>

// ---------- wiring ----------
function render() {
  try { localStorage.setItem('sourceVoiceMock', JSON.stringify({ mock: S.mock })); } catch {}
  document.getElementById('mockSeg').innerHTML = Object.entries(MOCKS).map(([k, m]) => `<button data-mock="${k}" class="px-3 py-1 ${S.mock === k ? 'bg-slate-800 text-slate-100' : 'hover:text-slate-200'}">${m.label}</button>`).join('');
  document.getElementById('stateSeg').innerHTML = Object.entries(STATES).map(([k, l]) => `<button data-state="${k}" class="px-3 py-1 ${S.state === k ? 'bg-slate-800 text-slate-100' : 'hover:text-slate-200'}">${l}</button>`).join('');
  document.getElementById('note').textContent = MOCKS[S.mock].note;
  document.getElementById('main').innerHTML = { A: mockA, B: mockB, C: mockC, D: mockD, E: mockE, F: mockF }[S.mock]();
  document.getElementById('overlay').innerHTML = 'CDF'.includes(S.mock) ? browseOverlay() : '';
}

document.addEventListener('click', (e) => {
  const m = e.target.closest('[data-mock]');
  if (m) { S.mock = m.dataset.mock; S.opts = false; S.browse = false; return render(); }
  const st = e.target.closest('[data-state]');
  if (st) { S.state = st.dataset.state; S.speakers = S.state === 'multi' ? 3 : S.state === 'loaded' || S.state === 'empty' ? 1 : S.speakers; return render(); }
  const a = e.target.closest('[data-act]');
  if (!a) { if (S.opts) { S.opts = false; render(); } return; }
  if (a.disabled) return;
  const act = a.dataset.act;
  if (act === 'closeBrowse') { if (a.tagName !== 'BUTTON' && e.target !== a) return; S.browse = false; }
  else if (act === 'play') { e.stopPropagation(); S.playing = S.playing === a.dataset.v ? null : a.dataset.v; }
  else if (act === 'pick') { if (e.target.closest('[data-act="play"]')) return; S.voice = a.dataset.v; if (a.dataset.close) { S.browse = false; if (S.mock === 'F' && S.cmp.length < 3 && !S.cmp.includes(S.voice)) S.cmp.push(S.voice); } }
  else if (act === 'engine') S.engine = a.dataset.e;
  else if (act === 'spk') S.speakers = Number(a.dataset.n);
  else if (act === 'gender') S.gender = a.dataset.g;
  else if (act === 'indian') S.indian = !S.indian;
  else if (act === 'fav') S.fav = !S.fav;
  else if (act === 'more') S.more = !S.more;
  else if (act === 'opts') { S.opts = !S.opts; return render(); }
  else if (act === 'browse') S.browse = true;
  else if (act === 'expand') S.expand = !S.expand;
  else if (act === 'tab') S.tab = a.dataset.t;
  else if (act === 'cmpAdd') { if (S.cmp.length < 3 && !S.cmp.includes(a.dataset.v)) S.cmp.push(a.dataset.v); }
  else if (act === 'cmpDel') S.cmp = S.cmp.filter((id) => id !== a.dataset.v);
  else if (act === 'addSlot') S.browse = true;
  else return;
  if (act !== 'opts') S.opts = act === 'sens' ? S.opts : false;
  render();
});
document.addEventListener('change', (e) => {
  const act = e.target.dataset.act;
  if (act === 'lang') S.lang = e.target.value;
  else if (act === 'src') S.src = e.target.value;
  else return;
  render();
});
document.addEventListener('input', (e) => {
  const act = e.target.dataset.act;
  if (act === 'sens') { S.sens = Number(e.target.value); e.target.style.setProperty('--p', `${S.sens}%`); const label = e.target.parentElement.querySelector('.mono'); if (label) label.textContent = S.sens; }
  else if (act === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const el = document.querySelector('input[data-act="q"]'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});

render();
</script>
</body>
</html>

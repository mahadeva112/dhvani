<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pro Home Mocks</title>
<script src="https://cdn.tailwindcss.com/3.4.10"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      slate: { 50:'#f6f6f7',100:'#ececef',200:'#dcdde1',300:'#c6c8ce',400:'#abadb5',500:'#8b8e98',600:'#5a5d66',700:'#34363c',800:'#232529',900:'#18191c',950:'#111214' },
      indigo: { 200:'#c9cefa',300:'#a5adf5',400:'#7b86ec',500:'#5866e0',600:'#4c59d0',950:'#23253a' },
      edge: '#27292d',
    } } },
  };
</script>
<style>
  html, body { overflow-x: clip; }
  body { background:#0b0c0e; font-family: Inter, system-ui, "Noto Sans Bengali", "Noto Sans Devanagari", sans-serif; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  button, select, input[type=range] { cursor:default; }
  .seg button.on { background:#5866e0; color:#fff; }
  .sw { width:30px; height:17px; border-radius:999px; background:#34363c; position:relative; flex-shrink:0; display:inline-block; }
  .sw::after { content:''; position:absolute; top:3px; left:3px; width:11px; height:11px; border-radius:50%; background:#fff; }
  .sw.on { background:#5866e0; } .sw.on::after { left:16px; }
  .dash { background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%235a5d66' stroke-width='2' stroke-dasharray='8%2c 9' stroke-linecap='round'/%3e%3c/svg%3e"); }
  .scroll { scrollbar-width: thin; scrollbar-color: #34363c transparent; }
  input[type=range] { accent-color:#5866e0; height:4px; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid #27292d; color:#abadb5; background:#111214; white-space:nowrap; }
  .pill.on { border-color:#5866e0; color:#c9cefa; background:rgba(88,102,224,.14); }

  /* Mock A · seam between two lines */
  .row { transition: background .12s, box-shadow .12s; }
  .row.pairTop { background: rgba(88,102,224,.10); box-shadow: inset 3px 0 0 #7b86ec; border-bottom-color: transparent !important; }
  .row.pairBot { background: rgba(88,102,224,.10); box-shadow: inset 3px 0 0 #7b86ec; }
  .seam { position:relative; height:0; z-index:6; }
  .seam .hit { position:absolute; left:0; right:0; top:-8px; height:16px; }
  .seam .line { position:absolute; left:16px; right:16px; top:-1px; height:2px; border-radius:2px; background:#7b86ec; opacity:0; transition:opacity .12s; }
  .seam .join { position:absolute; left:50%; top:-13px; transform:translateX(-50%); opacity:0; transition:opacity .12s, transform .12s; }
  .seam:hover .line, .seam.show .line { opacity:1; }
  .seam:hover .join, .seam.show .join { opacity:1; }
  .seam.blocked .line { background:#34363c; }
  .seam .faint { position:absolute; left:50%; top:-3px; width:6px; height:6px; margin-left:-3px; border-radius:50%; background:#34363c; transition:opacity .12s; }
  .seam:hover .faint, .seam.show .faint { opacity:0; }

  /* Mock C · gutter bracket */
  .gut { position:relative; height:0; z-index:6; }
  .gut .lk { position:absolute; left:22px; top:-11px; width:22px; height:22px; border-radius:7px; display:grid; place-items:center; background:#18191c; border:1px solid #34363c; color:#8b8e98; opacity:.0; transition:opacity .12s; }
  .doc:hover .gut .lk { opacity:.55; }
  .gut:hover .lk, .gut.show .lk { opacity:1 !important; border-color:#7b86ec; color:#c9cefa; background:#23253a; }
  .gut .tip { position:absolute; right:12px; top:-11px; opacity:0; pointer-events:none; transition:opacity .12s; }
  .gut:hover .tip, .gut.show .tip { opacity:1; }
  .crow.br { box-shadow: inset 2px 0 0 #7b86ec; background: rgba(88,102,224,.07); }

  .word { border-radius:3px; }
  .gap { white-space:pre; border-radius:3px; cursor:col-resize; padding:0 1px; }
  .gap:hover { background:rgba(123,134,236,.6); }
  .toast { animation: up .25s ease-out; }
  @keyframes up { from { transform: translate(-50%, 8px); opacity:0 } to { transform: translate(-50%, 0); opacity:1 } }
  .pulse { animation: pl 1.6s ease-in-out infinite; }
  @keyframes pl { 0%,100% { opacity:.55 } 50% { opacity:1 } }
</style>
</head>
<body class="text-slate-100 min-h-screen p-3 sm:p-5">

<div class="max-w-[92rem] mx-auto mb-3 flex flex-wrap items-center gap-2 text-[12.5px] text-slate-400">
  <span class="px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-300 font-medium">Mock</span>
  <span class="seg inline-flex rounded-lg border border-edge overflow-hidden" id="mockSeg">
    <button data-m="a" class="px-3 py-1.5">A · Studio (৩ কলাম)</button>
    <button data-m="b" class="px-3 py-1.5">B · কার্ড</button>
    <button data-m="c" class="px-3 py-1.5">C · ডকুমেন্ট</button>
    <button data-m="d" class="px-3 py-1.5">D · টাইমলাইন</button>
  </span>
  <span class="seg inline-flex rounded-lg border border-edge overflow-hidden" id="frameSeg">
    <button data-f="1" class="px-3 py-1.5">১ · Home</button>
    <button data-f="2" class="px-3 py-1.5">২ · আপলোডের পর</button>
    <button data-f="3" class="px-3 py-1.5">৩ · Transcript তৈরি</button>
    <button data-f="4" class="px-3 py-1.5">৪ · Edit + Join</button>
  </span>
  <button id="reset" class="ml-auto px-2.5 py-1.5 rounded-lg border border-edge hover:bg-slate-800 text-slate-300">লাইনগুলো আগের মতো</button>
</div>
<p id="note" class="max-w-[92rem] mx-auto mb-3 text-[13px] leading-relaxed text-slate-300"></p>

<div id="stage" class="max-w-[92rem] mx-auto rounded-2xl border border-edge bg-slate-950 overflow-hidden relative" style="height:min(860px, calc(100vh - 7.5rem)); min-height:640px"></div>

<script>
/* ---------- data ---------- */
const DUR = 36.8;
const SEGS0 = [
  { s:0.0,  e:4.2,  sp:1, t:"When you sit quietly, the mind slowly settles on its own." },
  { s:4.2,  e:7.9,  sp:1, t:"You don't have to fight it," },
  { s:7.9,  e:11.6, sp:1, t:"just stop feeding it." },
  { s:12.4, e:15.8, sp:2, t:"So is that why mornings feel easier?" },
  { s:16.3, e:21.0, sp:1, t:"Yes. In the early hours the body is still and the air is fresh." },
  { s:21.0, e:24.1, sp:1, t:"Use that time well." },
  { s:24.9, e:29.5, sp:1, t:"Even ten minutes of stillness changes how the whole day goes." },
  { s:30.2, e:33.0, sp:2, t:"I'll try it tomorrow." },
  { s:33.4, e:36.8, sp:1, t:"Don't try. Just do it." },
];
const SPK = { 1:{ name:'Speaker 1', c:'#7b86ec', bg:'rgba(123,134,236,.16)' }, 2:{ name:'Speaker 2', c:'#e0a458', bg:'rgba(224,164,88,.16)' } };
const VOICES = [
  { id:'meera', n:'Meera', tags:'Woman · warm · Hindi', fav:true },
  { id:'kabir', n:'Kabir', tags:'Man · deep · Hindi', fav:true },
  { id:'aarav', n:'Aarav', tags:'Man · calm · narrator' },
  { id:'ishita', n:'Ishita', tags:'Woman · bright · young' },
  { id:'rohan', n:'Rohan', tags:'Man · steady · news' },
  { id:'tara', n:'Tara', tags:'Woman · soft · story' },
];
const RECENT = [
  { n:'morning-talk_ep11', d:'42:10', l:'EN → HI', st:'Review', when:'Today' },
  { n:'q-and-a_satsang_03', d:'18:44', l:'EN → BN', st:'Dub', when:'Yesterday' },
  { n:'yoga-intro_short', d:'1:58', l:'EN → TA', st:'Translation', when:'24 Nov' },
  { n:'podcast_guest_12', d:'55:02', l:'EN → HI', st:'Transcript', when:'22 Nov' },
];
const clone = (x) => JSON.parse(JSON.stringify(x));
const S = { m:'a', f:1, segs:clone(SEGS0), editing:false, hist:[], saved:null, typing:null, voice:'meera', castFor:1, cast:{1:'meera',2:'kabir'}, sel:[], toast:null, bound:2 };

/* ---------- helpers ---------- */
const ic = (n, c='w-4 h-4') => `<i data-lucide="${n}" class="${c}"></i>`;
const ft = (t) => { const m = Math.floor(t/60), s = (t - m*60); return `${m}:${s.toFixed(1).padStart(4,'0')}`; };
const n2 = (i) => String(i+1).padStart(2,'0');
function rnd(seed){ let s = seed; return () => { s = (s*9301 + 49297) % 233280; return s/233280; }; }
function spAt(t){ const g = S.segs.find(x => t >= x.s && t < x.e); return g ? g.sp : 0; }
function wave({ w=640, h=44, n=150, seed=7, tint=false, hi=null }={}){
  const r = rnd(seed); const bw = w/n; let out = '';
  for (let i=0;i<n;i++){
    const t = (i+.5)/n*DUR; const sp = spAt(t);
    let a = sp ? .25 + r()*.75 : .05 + r()*.08; if (sp && r() < .12) a *= .4;
    const bh = Math.max(2, a*h*.92);
    let col = '#5a5d66';
    if (tint && sp) col = SPK[sp].c;
    let op = 1; if (hi && !(t >= hi[0] && t < hi[1])) op = .3;
    out += `<rect x="${(i*bw).toFixed(2)}" y="${((h-bh)/2).toFixed(2)}" width="${Math.max(1,bw-1).toFixed(2)}" height="${bh.toFixed(2)}" rx="1" fill="${col}" opacity="${op}"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="w-full block" style="height:${h}px">${out}</svg>`;
}
function stepsBar(active){
  const steps = ['Setup','Translation','Dub','Review'];
  return `<nav class="flex items-center gap-1 text-[12px]">${steps.map((s,i)=>{
    const done = i < active, on = i === active;
    return `<span class="flex items-center gap-1.5 px-2.5 h-7 rounded-md ${on?'bg-slate-800 text-slate-100':'text-slate-500'}">
      <span class="w-4 h-4 rounded-full grid place-items-center text-[9.5px] font-bold ${done?'bg-emerald-500/25 text-emerald-300':on?'bg-indigo-500 text-white':'bg-slate-800 text-slate-500'}">${done?'✓':i+1}</span>${s}</span>${i<steps.length-1?`<span class="text-slate-700">›</span>`:''}`;
  }).join('')}</nav>`;
}
function appBar({ home=false, step=0 }={}){
  return `<header class="h-12 shrink-0 flex items-center gap-3 px-4 border-b border-edge bg-[#0e0f11]">
    <div class="flex items-center gap-2 font-semibold text-[14px]"><span class="w-6 h-6 rounded-md bg-indigo-500 grid place-items-center text-[12px] text-white">ध</span>Dhvani</div>
    <span class="text-slate-700">/</span>
    ${home ? `<span class="text-[13px] text-slate-300">Home</span>` : `<span class="text-[13px] text-slate-200 flex items-center gap-1.5">${ic('house','w-3.5 h-3.5 text-slate-500')}<span class="text-slate-500">Home ›</span> morning-talk_ep12</span>`}
    ${home ? '' : `<div class="mx-auto hidden md:block">${stepsBar(step)}</div>`}
    <div class="${home?'ml-auto':''} flex items-center gap-1.5">
      <button class="h-8 px-2.5 rounded-lg border border-edge text-[12px] text-slate-300 flex items-center gap-1.5 hover:bg-slate-800">${ic('wrench','w-3.5 h-3.5')}Tools <span class="mono text-[10px] text-slate-500">Ctrl K</span></button>
      <span class="h-8 px-2.5 rounded-lg border border-edge text-[11.5px] text-slate-400 flex items-center gap-1.5">${ic('gauge','w-3.5 h-3.5')}41,200 credits</span>
      <button class="w-8 h-8 rounded-lg border border-edge grid place-items-center text-slate-400 hover:bg-slate-800">${ic('settings','w-4 h-4')}</button>
    </div>
  </header>`;
}
function seg(opts, on, cls=''){
  return `<span class="seg inline-flex rounded-lg border border-edge overflow-hidden text-[12px] ${cls}">${opts.map(o=>`<button class="px-2.5 h-7 ${o===on?'on':'text-slate-300 hover:bg-slate-800'}">${o}</button>`).join('')}</span>`;
}
function selectBox(label, val, w='w-full'){
  return `<label class="block ${w}"><span class="block text-[11px] text-slate-500 mb-1">${label}</span>
    <span class="h-8 px-2.5 rounded-lg border border-edge bg-slate-950 flex items-center justify-between text-[12.5px] text-slate-200">${val}${ic('chevron-down','w-3.5 h-3.5 text-slate-500')}</span></label>`;
}
function fileCard({ compact=false }={}){
  return `<div class="rounded-xl border border-edge bg-slate-900/70 ${compact?'p-2.5':'p-3'}">
    <div class="flex items-center gap-2.5">
      <span class="w-8 h-8 rounded-lg bg-slate-800 grid place-items-center text-slate-300">${ic('file-audio','w-4 h-4')}</span>
      <div class="min-w-0 flex-1"><div class="text-[13px] font-medium truncate">morning-talk_ep12.mp4</div>
        <div class="text-[11px] text-slate-500 mono">0:36.8 · 48 kHz · stereo</div></div>
      <button class="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 grid place-items-center">${ic('play','w-3.5 h-3.5')}</button>
      <button class="text-[11.5px] text-slate-400 hover:text-slate-200 px-1.5">Replace</button>
    </div>
    <div class="mt-2.5">${wave({ h: compact?28:40, tint: S.f>=3 })}</div>
  </div>`;
}
function transcribeForm({ done=false, inline=false }={}){
  const btn = done
    ? `<div class="flex items-center gap-2 text-[12px]"><span class="flex items-center gap-1.5 text-emerald-300">${ic('check','w-3.5 h-3.5')}Transcribed · ${S.segs.length} lines</span><button class="ml-auto text-slate-400 hover:text-slate-200 flex items-center gap-1">${ic('rotate-ccw','w-3.5 h-3.5')}Transcribe again</button></div>`
    : `<button class="w-full h-9 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-white text-[13px] font-semibold flex items-center justify-center gap-2">${ic('audio-lines','w-4 h-4')}Transcribe</button>
       <p class="text-[11px] text-slate-500 text-center mt-1.5">Writes down what is said, in the spoken language. Never translates.</p>`;
  if (inline) return `<div class="flex flex-wrap items-end gap-3">
      ${selectBox('Spoken language','Auto-detect (English)','w-44')}
      <div><span class="block text-[11px] text-slate-500 mb-1">Speakers</span>${seg(['1','2','3','4+','Detect'],'2')}</div>
      <div><span class="block text-[11px] text-slate-500 mb-1">Model</span>${seg(['Scribe v2','v3'],'Scribe v2')}</div>
      <label class="flex items-center gap-2 text-[12px] text-slate-300 h-8"><span class="sw"></span>Mark laughs &amp; music</label>
      <div class="ml-auto">${done ? `<span class="h-8 flex items-center gap-1.5 text-[12px] text-emerald-300">${ic('check','w-3.5 h-3.5')}Transcribed · ${S.segs.length} lines <button class="ml-2 text-slate-400">Again</button></span>` : `<button class="h-8 px-4 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-white text-[13px] font-semibold flex items-center gap-2">${ic('audio-lines','w-4 h-4')}Transcribe</button>`}</div>
    </div>`;
  return `<div class="space-y-3">
    ${selectBox('Spoken language','Auto-detect (English)')}
    <div><span class="block text-[11px] text-slate-500 mb-1">Speakers</span>${seg(['1','2','3','4+','Detect'],'2')}</div>
    <div><span class="block text-[11px] text-slate-500 mb-1">Model</span>${seg(['Scribe v2','Scribe v3'],'Scribe v2')}</div>
    <label class="flex items-center justify-between text-[12px] text-slate-300"><span>Mark laughs &amp; music</span><span class="sw"></span></label>
    <label class="flex items-center justify-between text-[12px] text-slate-300"><span>Cut at pauses</span><span class="sw on"></span></label>
    <div class="pt-1">${btn}</div>
  </div>`;
}
function voiceCards(cols=2){
  return `<div class="grid ${cols===2?'grid-cols-2':'grid-cols-1'} gap-1.5">${VOICES.map(v=>{
    const on = S.cast[S.castFor] === v.id;
    return `<button data-voice="${v.id}" class="text-left rounded-lg border ${on?'border-indigo-500 bg-indigo-500/10':'border-edge hover:border-slate-600 bg-slate-950'} p-2 flex items-center gap-2">
      <span class="w-7 h-7 shrink-0 rounded-full ${on?'bg-indigo-500 text-white':'bg-slate-800 text-slate-300'} grid place-items-center">${ic('play','w-3 h-3')}</span>
      <span class="min-w-0 flex-1"><span class="block text-[12.5px] font-medium truncate">${v.n}${v.fav?' <span class="text-amber-300">★</span>':''}</span><span class="block text-[10.5px] text-slate-500 truncate">${v.tags}</span></span>
      ${on?ic('check','w-3.5 h-3.5 text-indigo-300'):''}
    </button>`;}).join('')}</div>`;
}
function castRows(){
  return `<div class="space-y-1">${[1,2].map(sp=>{
    const v = VOICES.find(x=>x.id===S.cast[sp]); const on = S.castFor===sp;
    return `<button data-cast="${sp}" class="w-full flex items-center gap-2 h-9 px-2.5 rounded-lg border ${on?'border-indigo-500/70 bg-indigo-500/[.07]':'border-edge bg-slate-950 hover:border-slate-600'} text-left">
      <span class="w-2 h-2 rounded-full" style="background:${SPK[sp].c}"></span>
      <span class="text-[12px] text-slate-300 w-[4.6rem]">${SPK[sp].name}</span>
      <span class="text-[12.5px] font-medium flex-1 truncate">${v.n}</span>
      <span class="text-[10.5px] text-slate-500">${sp===1?'78%':'22%'}</span>${ic('chevron-right','w-3.5 h-3.5 text-slate-500')}
    </button>`;}).join('')}</div>`;
}
function voiceSettings({ tight=false }={}){
  const v = VOICES.find(x=>x.id===S.cast[S.castFor]);
  const sl = (l, val, pct) => `<label class="block"><span class="flex justify-between text-[11px] text-slate-400 mb-0.5"><span>${l}</span><span class="mono text-slate-300">${val}</span></span><input type="range" class="w-full" value="${pct}"></label>`;
  return `<div class="rounded-xl border border-edge bg-slate-900/60 p-3">
    <div class="flex items-center gap-2 mb-2.5"><span class="text-[12px] text-slate-400">Settings for</span><span class="text-[12.5px] font-semibold">${v.n}</span><span class="text-[11px] text-slate-500">· ${SPK[S.castFor].name}</span>
      <span class="ml-auto">${selectBox('', 'Eleven v3', 'w-28').replace('<span class="block text-[11px] text-slate-500 mb-1"></span>','')}</span></div>
    <div class="grid ${tight?'grid-cols-2':'grid-cols-2'} gap-x-4 gap-y-2.5">
      ${sl('Speed','1.00×',50)}${sl('Stability','50',50)}${sl('Similarity','75',75)}${sl('Style','0',0)}
    </div>
    <button class="mt-3 w-full h-8 rounded-lg border border-edge hover:bg-slate-800 text-[12px] flex items-center justify-center gap-1.5">${ic('headphones','w-3.5 h-3.5')}Hear line 01 in this voice</button>
  </div>`;
}
function voicePanel({ cols=2, title=true }={}){
  return `<div class="space-y-3">
    ${title?`<div class="flex items-center gap-2"><h3 class="text-[13.5px] font-semibold">Voice</h3><span class="ml-auto text-[11.5px] text-slate-400">Dub into</span>${selectBox('','Hindi','w-24').replace('<span class="block text-[11px] text-slate-500 mb-1"></span>','')}</div>`:''}
    ${castRows()}
    <div class="relative">${ic('search','w-4 h-4 absolute left-2.5 top-2 text-slate-500')}<input class="w-full h-8 pl-8 pr-2 rounded-lg border border-edge bg-slate-950 text-[12.5px] placeholder:text-slate-500 focus:outline-none focus:border-indigo-500" placeholder="Search 5,254 voices — name, accent, style"></div>
    <div class="flex flex-wrap gap-1"><span class="pill on">Hindi</span><span class="pill">Man</span><span class="pill">Woman</span><span class="pill">Calm</span><span class="pill">★ Favourites</span><span class="pill">Recent</span></div>
    ${voiceCards(cols)}
    ${voiceSettings()}
  </div>`;
}
function translateBtn(label='Go to translation', big=false){
  return `<button data-go class="${big?'h-11 px-5 text-[14px]':'h-9 px-4 text-[13px]'} rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold flex items-center gap-2 shrink-0">${label}${ic('arrow-right','w-4 h-4')}</button>`;
}

/* ---------- transcript list (shared) ---------- */
function words(t, i){
  const w = t.split(' ');
  return w.map((x,k)=> (k?`<span class="gap" data-split="${i}:${k}" title="Split here"> </span>`:'') + `<span class="word">${x}</span>`).join('');
}
function textCell(g, i){
  if (S.editing && S.typing === i) return `<input data-type="${i}" class="w-full bg-slate-950 border border-indigo-500 rounded-md px-2 py-1 text-[13px] focus:outline-none" value="${g.t.replace(/"/g,'&quot;')}">`;
  if (S.editing) return `<span class="text-[13px] leading-[1.85] text-slate-200" data-dbl="${i}" title="Double-click to type">${words(g.t,i)}</span>`;
  return `<span class="text-[13px] leading-snug text-slate-200">${g.t}</span>`;
}
function spkPill(sp, edit){
  return `<span class="inline-flex items-center gap-1 h-5 px-1.5 rounded-md text-[10.5px] font-medium" style="background:${SPK[sp].bg};color:${SPK[sp].c}">${SPK[sp].name.replace('Speaker ','S')}${edit?ic('chevron-down','w-3 h-3'):''}</span>`;
}
function rowsA(){
  return S.segs.map((g,i)=>{

function render(){
  document.querySelectorAll('#mockSeg button').forEach(b=>b.classList.toggle('on', b.dataset.m===S.m));
  document.querySelectorAll('#frameSeg button').forEach(b=>b.classList.toggle('on', +b.dataset.f===S.f));
  document.getElementById('note').innerHTML = NOTES[S.m][S.f-1];
  const st = document.getElementById('stage');
  const body = { a:mockA, b:mockB, c:mockC, d:mockD }[S.m]();
  st.innerHTML = `<div class="h-full flex flex-col">${body}</div>${S.toast?`<div class="toast absolute left-1/2 bottom-5 -translate-x-1/2 z-50 h-9 px-3 rounded-xl bg-slate-100 text-slate-900 text-[12.5px] font-medium flex items-center gap-3 shadow-2xl">${S.toast}<button data-undo class="font-semibold text-indigo-600">Undo</button></div>`:''}`;
  lucide.createIcons();
  // pair highlight for seams (A) and gutter (C)
  st.querySelectorAll('.seam').forEach(sm=>{
    const i = +sm.dataset.seam; const lit = (on)=>{ const a = st.querySelector(`.row[data-row="${i}"]`), b = st.querySelector(`.row[data-row="${i+1}"]`); a&&a.classList.toggle('pairTop',on); b&&b.classList.toggle('pairBot',on); };
    if (sm.classList.contains('show')) lit(true);
    sm.addEventListener('mouseenter',()=>{ if(!sm.classList.contains('blocked')) lit(true); });
    sm.addEventListener('mouseleave',()=>{ if(!sm.classList.contains('show')) lit(false); });
  });
  st.querySelectorAll('.gut').forEach(gt=>{
    const i = +gt.dataset.gut; const lit = (on)=>[i,i+1].forEach(k=>{ const r = st.querySelector(`.crow[data-row="${k}"]`); r&&r.classList.toggle('br',on); });
    if (gt.classList.contains('show')) lit(true);
    gt.addEventListener('mouseenter',()=>lit(true)); gt.addEventListener('mouseleave',()=>{ if(!gt.classList.contains('show')) lit(false); });
  });
  const inp = st.querySelector('[data-type]'); if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}
function snap(){ S.hist.push(clone(S.segs)); }
function join(i){
  const a = S.segs[i], b = S.segs[i+1]; if (!a || !b || a.sp!==b.sp) return;
  snap(); S.segs.splice(i, 2, { s:a.s, e:b.e, sp:a.sp, t:(a.t+' '+b.t).replace(/\s+/g,' ') });
  S.toast = `Joined ${n2(i)} and ${n2(i+1)}`; S.sel = []; S.bound = -1; render(); flash();
}
let tt; function flash(){ clearTimeout(tt); tt = setTimeout(()=>{ S.toast=null; render(); }, 2600); }
function split(i, k){
  const g = S.segs[i]; const w = g.t.split(' '); const left = w.slice(0,k).join(' '), right = w.slice(k).join(' ');
  const at = +(g.s + (g.e-g.s) * left.length/(g.t.length)).toFixed(1);
  snap(); S.segs.splice(i, 1, { s:g.s, e:at, sp:g.sp, t:left }, { s:at, e:g.e, sp:g.sp, t:right });
  S.toast = `Split ${n2(i)} at ${ft(at)}`; render(); flash();
}
function startEdit(){ S.editing = true; S.saved = clone(S.segs); S.hist = []; S.sel = S.m==='b' && S.f===4 ? [1,2] : []; S.bound = S.m==='d' && S.f===4 ? 1 : -1; }
document.addEventListener('click', (e)=>{
  const t = e.target.closest('button, .gap'); if (!t) return;
  const d = t.dataset;
  if (d.m){ S.m = d.m; S.segs = clone(SEGS0); setFrame(S.f); return; }
  if (d.f){ setFrame(+d.f); return; }
  if (t.id==='reset'){ S.segs = clone(SEGS0); setFrame(S.f); return; }
  if (d.upload !== undefined){ setFrame(2); return; }
  if (d.edit !== undefined){ if (S.editing && S.m==='d'){ S.editing=false; } else { startEdit(); if (S.f===3) S.f=4; } render(); return; }
  if (d.cancel !== undefined){ if (S.saved) S.segs = S.saved; S.editing=false; S.typing=null; S.f=3; render(); return; }
  if (d.save !== undefined){ const n = S.hist.length; S.editing=false; S.typing=null; S.f=3; S.toast = n ? `Saved ${n} change${n>1?'s':''} — one Undo step` : 'No changes'; render(); flash(); return; }
  if (d.undo !== undefined){ if (S.hist.length){ S.segs = S.hist.pop(); S.toast=null; render(); } return; }
  if (d.join !== undefined){ join(+d.join); return; }
  if (d.joinsel !== undefined){ const s=[...S.sel].sort((a,b)=>a-b); snap(); const a=S.segs[s[0]], b=S.segs[s[s.length-1]]; S.segs.splice(s[0], s.length, { s:a.s, e:b.e, sp:a.sp, t:s.map(x=>S.segs[x].t).join(' ') }); S.toast=`Joined ${s.length} lines`; S.sel=[]; render(); flash(); return; }
  if (d.pick !== undefined){ const i=+d.pick; S.sel = S.sel.includes(i) ? S.sel.filter(x=>x!==i) : [...S.sel, i]; render(); return; }
  if (d.clearsel !== undefined){ S.sel=[]; render(); return; }
  if (d.bound !== undefined){ S.bound = +d.bound===S.bound ? -1 : +d.bound; render(); return; }
  if (d.split){ const [i,k] = d.split.split(':').map(Number); split(i,k); return; }
  if (d.cast){ S.castFor = +d.cast; render(); return; }
  if (d.voice){ S.cast[S.castFor] = d.voice; render(); return; }
  if (d.go !== undefined){ S.toast = 'Opens Translation — nothing is translated until you press Translate there'; render(); flash(); return; }
});
document.addEventListener('dblclick', (e)=>{ const t = e.target.closest('[data-dbl]'); if (!t || e.target.classList.contains('gap')) return; S.typing = +t.dataset.dbl; render(); });
document.addEventListener('keydown', (e)=>{
  const inp = e.target.closest && e.target.closest('[data-type]'); if (!inp) return;
  if (e.key==='Enter'){ commitType(inp); }
  if (e.key==='Escape'){ S.typing=null; render(); }
});
document.addEventListener('focusout', (e)=>{ const inp = e.target.closest && e.target.closest('[data-type]'); if (inp) commitType(inp); });
function commitType(inp){ const i = +inp.dataset.type; const v = inp.value.trim(); if (S.typing===null) return; S.typing=null; if (v && v!==S.segs[i].t){ snap(); S.segs[i].t = v; } render(); }
function setFrame(f){
  S.f = f; S.typing = null; S.toast = null;
  if (f===4){ startEdit(); } else { S.editing = false; S.hist = []; S.sel=[]; }
  render();
}
setFrame(1);
</script>
</body>
</html>

<style>
  html, body { overflow-x: clip; }
  body { background:#0b0c0e; font-family: Inter, system-ui, "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif; }

  .fold { background: repeating-linear-gradient(90deg,#f43f5e 0 8px,transparent 8px 14px); height:2px; }
  .grp { display:flex; gap:2px; border:1px solid #27292d; background:#111214; border-radius:12px; padding:2px; }

  .ms b { width:18px; height:17px; border:1px solid #34363c; border-radius:4px; font-size:9.5px; display:inline-flex; align-items:center; justify-content:center; color:#abadb5; font-weight:600; }

<body class="text-slate-100 min-h-screen p-4 sm:p-6">

<div class="max-w-[100rem] mx-auto mb-2 flex flex-wrap items-center gap-2 text-[12.5px] text-slate-400">

  <p class="mt-2 text-[11.5px] text-slate-500">ফ্রেমটা app-এর window। dub lane-এ কোনো line-এ click করলে সেটা বাছা হয়, ফাঁকা জায়গায় click বা <span class="mono">Esc</span> করলে ছাড়ে। Blade / Snap / Ripple আর ▶ চাপা যায়। লাল দাগ = window-এর নিচের কিনারা।</p>
</div>

<script>
const ICON = {
  wave: '<path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  scissors: '<circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/>',
  magnet: '<path d="m6 15-4-4 6.75-6.77a7.79 7.79 0 0 1 11 11L13 22l-4-4 6.39-6.36a2.14 2.14 0 0 0-3-3L6 15"/><path d="m5 8 4 4"/><path d="m12 15 4 4"/>',
  ripple: '<path d="M17 12H3"/><path d="m11 18 6-6-6-6"/><path d="M21 5v14"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  redo: '<path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
  history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  split: '<path d="M8 19H5c-1 0-2-1-2-2V7c0-1 1-2 2-2h3"/><path d="M16 5h3c1 0 2 1 2 2v10c0 1-1 2-2 2h-3"/><path d="M12 4v16"/>',
  link: '<path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><path d="M8 12h8"/>',
  align: '<rect width="9" height="6" x="6" y="14" rx="2"/><rect width="16" height="6" x="6" y="4" rx="2"/><path d="M2 2v20"/>',
  mute: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  pauses: '<circle cx="4" cy="8" r="2"/><path d="M5.42 9.42 8 12"/><path d="m14 6-8.58 8.58"/><circle cx="4" cy="16" r="2"/><path d="M10.8 14.8 14 18"/><path d="M16 12h-2"/><path d="M22 12h-2"/>',
  tighten: '<path d="M2 12h6"/><path d="M22 12h-6"/><path d="M12 2v2"/><path d="M12 8v2"/><path d="M12 14v2"/><path d="M12 20v2"/><path d="m19 9-3 3 3 3"/><path d="m5 15 3-3-3-3"/>',
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
  zoomOut: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M8 11h6"/>',
  zoomIn: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M8 11h6"/><path d="M11 8v6"/>',
  fit: '<path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/>',
  help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  reset: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>',
  pause: '<rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/>',
  prev: '<path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/>',
  next: '<path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  loader: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  chevL: '<path d="m15 18-6-6 6-6"/>',
  chevR: '<path d="m9 18 6-6-6-6"/>',
  back: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
};
const ic = (n, c = 'w-4 h-4') => `<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

// ---------- data ----------
const VIEW = 14; // seconds on screen ("14 s" in the zoom group)
const TOTAL = 68;
const LINES = [
  { n: 1, src: [0.3, 3.5], dub: [0.35, 3.55], en: 'Every morning, the river wakes before the town.', hi: 'हर सुबह नदी शहर से पहले जाग जाती है।', col: '#5b6bd6' },
  { n: 2, src: [4.2, 7.8], dub: [4.6, 8.3], fix: [4.22, 7.92], en: 'Fishermen push their boats into the mist.', hi: 'मछुआरे अपनी नावें धुंध में उतारते हैं।', col: '#3f8f9e' },
  { n: 3, src: [9.4, 12.6], dub: [9.45, 13.4], en: "By noon, the water carries the whole valley's noise.", hi: 'दोपहर तक पानी पूरी घाटी का शोर ले चलता है।', col: '#a0723e' },
];
const TOL = 0.2;

const MOCKS = {
  now: { label: 'এখন', note: 'এখনকার পাতা, তুলনার জন্য। উপরে নিজের সারিতে title + তিনটে chip (No hand edits · 1 of 3 in sync · Audio up to date) + Reset/Done, তার নিচে tools-এর সারি, তারপর বাছা line-এর সারি, lanes, hint আর transport। "1 of 3 in sync" পড়ে বোঝা যায় না কোন দুটো line বাকি, chip-এ click-ও হয় না।' },
  A: { label: 'Mock A · এক সারিতে সব', note: 'Title, tools আর status এক সারিতে — একটা পুরো সারি বাঁচে, lanes লম্বা হয়। Chip-গুলো উঠে গিয়ে ডানে একটা শান্ত লেখা: "2 out of sync" (সব ঠিক থাকলে সবুজ "All in sync"), hand edit থাকলেই শুধু "1 edit", আর audio-র অবস্থা একটা ছোট ✓ / ঘুরন্ত চিহ্ন। Reset all edits শুধু icon (hover-এ নাম), Done আগের মতো।' },
  B: { label: 'Mock B · Edit mode bar + নিচে status bar', note: 'Edit timing খুললে app-এর উপরের বারটাই বদলে যায় (Photos / Resolve-এর মতো edit mode): বাঁয়ে ← Dub, মাঝে "Edit timing" আর project-এর নাম, ডানে Reset all edits ও Done। পাতার উপরে শুধু tools। সব status window-এর একেবারে নিচে পাতলা status bar-এ — audio, sync ("Next: Line 02 ›" চাপলে সেই line-এ যায়), hand edits, Snap/Ripple, zoom। Lanes সবচেয়ে বেশি জায়গা পায়।' },
  C: { label: 'Mock C · ডানে Inspector', note: 'DaVinci / Premiere-এর মতো ডানে একটা Inspector। উপরে "Sync" — তিনটে line-ই তালিকায়, কোনটা কেন বাইরে ("starts 0.40 s late", "ends 0.80 s over"), click করলে সেই line বাছা হয়। নিচে "Picked line" — Start, Speed, Gain, Fades একটার নিচে একটা, আর Split / Join / Align / Mute / Lock / Takes নাম-সহ বোতাম। তাই উপরের tools-সারিতে শুধু Blade/Snap/Ripple/Marker, Undo, zoom। বাছা line-এর আলাদা সারি নেই, lanes কখনও লাফায় না।' },
  D: { label: 'Mock D · আগে সমস্যা', note: 'Status শুধু তখনই, যখন কিছু করার আছে। "1 of 3 in sync"-এর জায়গায় একটা amber navigator: "⚠ 2 out of sync ‹ 1/2 ›" — তীর চাপলে পরের সমস্যার line বাছা হয়, আর বাছা line-এর সারিতে কারণ + এক-click সমাধান ("Starts 0.40 s late · Align (A)")। সব ঠিক হলে সবুজ "✓ All 3 in sync"। Hand edits-এর সংখ্যা History বোতামেই। Audio-র অবস্থা Done-এর পাশে ছোট করে। Zoom নেমে এসেছে transport-এর সারিতে (DAW-এর মতো), তাই উপরের সারি ছোট।' },
};
const STATES = { fresh: 'সবে খোলা (কোনো edit নেই)', edited: 'Line 02 সরানো হয়েছে · audio তৈরি হচ্ছে' };
const HEIGHTS = { 720: '720 px', 900: '900 px' };

let S = { mock: 'now', st: 'fresh', h: 900, pick: null, blade: false, snap: true, ripple: false, playing: false };
try { Object.assign(S, JSON.parse(localStorage.getItem('editTimingMocks') || '{}')); } catch {}

const fmt = (t) => { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(2).padStart(5, '0')}`; };
const fmtClock = (t) => { const m = Math.floor(t / 60), s = Math.floor(t - m * 60); return `${m}:${String(s).padStart(2, '0')}`; };
const PLAYHEAD = 5.1;

function lines() {
  return LINES.map((l) => {
    const dub = S.st === 'edited' && l.fix ? l.fix : l.dub;
    const drift = dub[0] - l.src[0];
    const over = dub[1] - l.src[1];
    let ok = true, why = '';
    if (Math.abs(drift) > TOL) { ok = false; why = `starts ${Math.abs(drift).toFixed(2)} s ${drift > 0 ? 'late' : 'early'}`; }
    else if (over > 0.5) { ok = false; why = `ends ${over.toFixed(2)} s over`; }
    return { ...l, dub, drift, over, ok, why, edited: S.st === 'edited' && Boolean(l.fix) };
  });
}
const stats = () => {
  const L = lines();
  const inSync = L.filter((l) => l.ok).length;
  return { L, inSync, out: L.length - inSync, edits: L.filter((l) => l.edited).length, saving: S.st === 'edited' };
};

// ---------- shared pieces ----------
function appBar() {
  return `<div class="shrink-0 h-14 px-4 flex items-center gap-3 border-b border-edge bg-slate-950">
    <span class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center">${ic('wave', 'w-4 h-4 text-white')}</span>
    <div class="leading-tight"><div class="text-[14px] font-semibold">Dhvani</div><div class="text-[10.5px] text-slate-500">Dubbing studio</div></div>
    <div class="ml-4 min-w-0"><div class="text-[12.5px] font-semibold truncate">River Morning — episode 3</div><div class="text-[11px] text-slate-400">English → Hindi · 1:08 <span class="ml-1 px-1.5 rounded bg-emerald-500/15 text-emerald-300">Dub ready</span></div></div>
    <div class="flex-1"></div>
    <div class="flex items-center gap-1 rounded-full border border-edge p-1 text-[12px]">
      <span class="px-2.5 py-1 text-slate-400">✓ Source &amp; voice</span>
      <span class="px-2.5 py-1 text-slate-400">✓ Review</span>
      <span class="px-2.5 py-1 rounded-full bg-slate-800 font-semibold"><span class="mr-1 inline-flex w-4 h-4 rounded-full bg-indigo-500 text-[10px] items-center justify-center">3</span>Dub</span></div>
    <div class="flex-1"></div>
    <button class="h-8 px-2.5 rounded-lg border border-edge bg-slate-900 hover:bg-slate-800 text-[12.5px] text-slate-200">Tools</button>
    <button class="h-8 px-2.5 rounded-lg border border-edge bg-slate-900 text-[12.5px] text-slate-200 flex items-center gap-1.5">${ic('folder', 'w-3.5 h-3.5')}Projects</button>
    <button class="h-8 px-3 rounded-lg bg-slate-100 text-slate-900 text-[12.5px] font-semibold">+ New dub</button>
  </div>`;
}

const tb = (icon, label, key, { on = false, act = '', disabled = false, text = '' } = {}) =>
  `<button class="tb ${text ? 'px-2' : ''} ${on ? 'on' : ''}" ${act ? `data-act="${act}"` : ''} ${disabled ? 'disabled' : ''} title="${label}${key ? ` (${key})` : ''}" aria-label="${label}">${ic(icon)}${text}</button>`;

function toolsMode() {
  return `<div class="grp">${tb('scissors', 'Blade', 'B', { on: S.blade, act: 'blade' })}${tb('magnet', 'Snap', 'N', { on: S.snap, act: 'snap' })}${tb('ripple', 'Ripple', 'Shift + drag', { on: S.ripple, act: 'ripple' })}${tb('flag', 'Marker', 'Shift + M')}</div>`;
}
function toolsHistory(count = true) {
  const { edits } = stats();
  return `<div class="grp">${tb('undo', 'Undo', 'Ctrl + Z', { disabled: !edits })}${tb('redo', 'Redo', 'Ctrl + Shift + Z', { disabled: true })}
    <button class="tb px-2 text-[12px] font-medium" title="Every edit so far">${ic('history')}History${count ? `<span class="mono text-[10.5px] ${edits ? 'text-indigo-300' : 'text-slate-500'}">${edits || 1}</span>` : ''}${ic('chev', 'w-3.5 h-3.5 text-slate-500')}</button></div>`;
}
function toolsLine() {
  return `<div class="grp">${tb('split', 'Split', 'S')}${tb('link', 'Join', 'G')}${tb('align', 'Align', 'A')}${tb('mute', 'Mute', 'M')}${tb('lock', 'Lock', 'L')}${tb('pauses', 'Split at pauses', 'D')}${tb('tighten', 'Tighten', 'Q')}${tb('mic', 'Takes', 'T')}</div>`;
}
function toolsZoom() {
  return `<div class="grp items-center">${tb('zoomOut', 'Zoom out', '−')}<span class="min-w-[3.25rem] text-center mono text-[11px] text-slate-400">14 s</span>${tb('zoomIn', 'Zoom in', '=')}<button class="tb px-2 text-[12px]" title="Whole track (Shift + Z)">${ic('fit', 'w-3.5 h-3.5')}Fit</button></div>`;
}
const shortcutsBtn = (label = true) => `<button class="h-9 px-2.5 rounded-xl border border-edge bg-slate-950 flex items-center gap-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800" title="Shortcuts (?)">${ic('help')}${label ? 'Shortcuts' : ''}</button>`;
const doneBtn = () => `<button class="h-8 px-3 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-xs font-semibold text-white flex items-center gap-1.5">${ic('check', 'w-3.5 h-3.5')}Done</button>`;
const resetBtn = (iconOnly = false) => {
  const { edits } = stats();
  return `<button ${edits ? '' : 'disabled'} title="Reset all edits" class="h-8 ${iconOnly ? 'w-8 justify-center' : 'px-3'} rounded-lg border border-slate-700 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 disabled:opacity-40 disabled:hover:bg-transparent flex items-center gap-1.5">${ic('reset', 'w-3.5 h-3.5')}${iconOnly ? '' : 'Reset all edits'}</button>`;
};
const audioState = (short = false) => stats().saving
  ? `<span class="flex items-center gap-1.5 text-[11.5px] text-slate-400">${ic('loader', 'w-3.5 h-3.5 spin')}${short ? 'Saving…' : 'Updating the audio…'}</span>`
  : `<span class="flex items-center gap-1.5 text-[11.5px] text-slate-400">${ic('check', 'w-3.5 h-3.5 text-emerald-400')}${short ? 'Saved' : 'Audio up to date'}</span>`;

function field(label, value, unit) {
  return `<label class="flex items-center gap-1.5 text-[11.5px] text-slate-400 whitespace-nowrap">${label}<span class="h-7 px-2 min-w-[3rem] rounded-md border border-edge bg-slate-950 mono text-[12px] text-slate-100 flex items-center">${value}</span>${unit ? `<span class="text-slate-500">${unit}</span>` : ''}</label>`;

function lanes({ headW = '12.5rem' } = {}) {
  const L = lines();

    const big = s % 2 === 0;
    ruler += `<span style="position:absolute;bottom:0;left:${pct(s)};width:1px;height:${big ? 10 : s % 1 === 0 ? 6 : 3}px;background:${big ? '#5a5d66' : '#34363c'}"></span>`;
    if (big && s < VIEW) ruler += `<span class="mono" style="position:absolute;top:3px;left:calc(${pct(s)} + 4px);font-size:10px;color:#8b8e98">${fmtClock(s)}</span>`;
  }
  const clips = L.map((l, i) => `<div class="clip ${S.pick === i ? 'picked' : ''}" data-act="pick" data-i="${i}" style="left:${pct(l.dub[0])};width:${pct(l.dub[1] - l.dub[0])};background:${l.col}55">
      <canvas data-cv="clip" data-i="${i}"></canvas>${l.ok ? '' : '<span class="warn"></span>'}</div>`).join('');
  const script = L.map((l) => `<span class="truncate" style="position:absolute;top:4px;left:${pct(l.dub[0])};width:${pct(l.dub[1] - l.dub[0])};font-size:11px;color:#c6c8ce;padding-left:4px">${l.hi}</span>`).join('');
  const drift = L.map((l) => {

  }).join('');

// ---------- waves ----------
function amp(t, segs, seed) {
  for (const [a, b] of segs) {
    if (t >= a && t <= b) {
      const edge = Math.min(1, (t - a) * 8, (b - t) * 8);
      const syl = Math.abs(Math.sin(t * 9.1 + seed)) * 0.6 + 0.4;
      const word = Math.abs(Math.sin(t * 2.3 + seed * 1.7)) * 0.7 + 0.3;
      const n = (Math.sin(t * 173.3 + seed * 31) + 1) / 2;
      return Math.min(1, edge * syl * word * (0.75 + n * 0.25));
    }
  }
  return 0.02 + ((Math.sin(t * 211 + seed) + 1) / 2) * 0.02;
}
function drawCanvas(cv, fn, color) {
  const r = cv.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const mid = r.height / 2;
  ctx.fillStyle = color;
  for (let px = 0; px < r.width; px++) {
    const a = fn(px / r.width) * (mid - 3) * 0.72;
    ctx.fillRect(px, mid - a, 1, Math.max(1, a * 2));
  }
}
function drawWaves() {
  const L = lines();
  document.querySelectorAll('canvas[data-cv="orig"]').forEach((cv) => drawCanvas(cv, (x) => amp(x * VIEW, LINES.map((l) => l.src), 1), 'rgba(34,211,238,.55)'));
  document.querySelectorAll('canvas[data-cv="clip"]').forEach((cv) => {
    const l = L[Number(cv.dataset.i)];
    const len = l.dub[1] - l.dub[0];
    drawCanvas(cv, (x) => amp(x * len, [[0.05, len - 0.05]], l.n * 3), 'rgba(236,236,239,.42)');
  });
}

// ---------- render ----------
function seg(id, items, cur, act) {
  document.getElementById(id).innerHTML = Object.entries(items).map(([k, v]) => {
    const l = typeof v === 'string' ? v : v.label;
    return `<button data-act="${act}" data-k="${k}" class="px-3 py-1.5 text-[12.5px] border-r border-edge last:border-r-0 ${String(cur) === k ? 'bg-indigo-600 text-white font-semibold' : 'bg-slate-900 text-slate-300 hover:bg-slate-800'}">${l}</button>`;
  }).join('');
}
function render() {
  seg('mockSeg', MOCKS, S.mock, 'mock');
  seg('stateSeg', STATES, S.st, 'st');
  seg('hSeg', HEIGHTS, S.h, 'h');
  document.getElementById('note').textContent = MOCKS[S.mock].note;
  const fr = document.getElementById('frame');
  fr.style.height = S.h + 'px';
  const top = S.mock === 'B' ? editBar() : appBar();
  const body = { now: mockNow, A: mockA, B: mockB, C: mockC, D: mockD }[S.mock]();
  fr.innerHTML = top + body + `<div class="fold absolute left-0 right-0 bottom-0"></div>`;
  requestAnimationFrame(drawWaves);
  try { localStorage.setItem('editTimingMocks', JSON.stringify({ mock: S.mock, st: S.st, h: S.h })); } catch {}
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'mock') S.mock = b.dataset.k;
  else if (a === 'st') { S.st = b.dataset.k; S.pick = S.st === 'edited' ? 1 : null; }
  else if (a === 'h') S.h = Number(b.dataset.k);
  else if (a === 'blade') S.blade = !S.blade;
  else if (a === 'snap') S.snap = !S.snap;
  else if (a === 'ripple') S.ripple = !S.ripple;
  else if (a === 'play') S.playing = !S.playing;
  else if (a === 'pick' || a === 'goto') S.pick = Number(b.dataset.i);
  else if (a === 'lanebg') S.pick = null;
  else if (a === 'fix') { S.st = 'edited'; }
  else if (a === 'nav') {
    const L = lines();
    const bad = L.map((l, i) => (l.ok ? -1 : i)).filter((i) => i >= 0);
    if (bad.length) {
      const at = bad.indexOf(S.pick);
      const d = Number(b.dataset.d);
      S.pick = bad[at < 0 ? (d > 0 ? 0 : bad.length - 1) : (at + d + bad.length) % bad.length];
    }
  }
  else return;
  render();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.pick !== null) { S.pick = null; render(); } });
window.addEventListener('resize', () => requestAnimationFrame(drawWaves));
if (S.st === 'edited' && S.pick === null) S.pick = 1;
render();
</script>
</body>

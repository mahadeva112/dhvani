<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice List Space</title>
<script src="https://cdn.tailwindcss.com/3.4.10"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      slate: { 50:'#f6f6f7',100:'#ececef',200:'#dcdde1',300:'#c6c8ce',400:'#abadb5',500:'#8b8e98',600:'#5a5d66',700:'#34363c',800:'#232529',900:'#18191c',950:'#111214' },
      indigo: { 300:'#a5adf5',400:'#7b86ec',500:'#5866e0',600:'#4c59d0',950:'#23253a' },
      edge: '#27292d',
    } } },
  };
</script>
<style>
  html, body { overflow-x: clip; }
  body { background:#0b0c0e; font-family: Inter, system-ui, "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .scroll::-webkit-scrollbar { width:8px } .scroll::-webkit-scrollbar-thumb { background:#34363c; border-radius:8px } .scroll::-webkit-scrollbar-track { background:transparent }
  .sw { width:34px; height:19px; border-radius:999px; background:#5866e0; position:relative; flex-shrink:0; display:inline-block; }
  .sw::after { content:''; position:absolute; top:3px; left:18px; width:13px; height:13px; border-radius:50%; background:#fff; }
  .row .ply { opacity:0 } .row:hover .ply, .row.sel .ply { opacity:1 }
  .row:hover .av, .row.sel .av { opacity:0 }
  button { cursor:default; }
</style>
</head>
<body class="text-slate-100 min-h-screen p-4 sm:p-6">

<div class="max-w-[100rem] mx-auto mb-2 flex flex-wrap items-center gap-2 text-[12.5px] text-slate-400">
  <span class="px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-300 font-medium">Mock</span>
  <span id="mockSeg" class="inline-flex flex-wrap rounded-lg border border-edge overflow-hidden"></span>
</div>
<p id="note" class="max-w-[100rem] mx-auto mb-4 text-[13.5px] text-slate-300 leading-relaxed"></p>

<div class="max-w-[100rem] mx-auto overflow-x-auto">
  <div id="frame" class="min-w-[1100px] h-[730px] flex gap-4"></div>
</div>

<script>
const ICON = {
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  pause: '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  swap: '<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
  filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
  gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  text: '<path d="M17 6.1H3"/><path d="M21 12.1H3"/><path d="M15.1 18H3"/>',
};
const ic = (n, c = 'w-4 h-4') => `<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

const GRAD = ['from-sky-500 to-indigo-500','from-orange-500 to-amber-500','from-violet-500 to-fuchsia-500','from-emerald-500 to-teal-500','from-blue-500 to-cyan-500'];
const VOICES = [
  { n:'Aaditya', d:'Rich, Deep and Suspenseful', g:'Male', age:'Middle aged', use:'Narration', acc:'Standard Hindi', c:0 },
  { n:'Aaditya Kapur', d:'Calm Conversational Hindi Voice', g:'Male', age:'Young', use:'Conversational', acc:'Delhi', c:0 },
  { n:'Aahir', d:'Calm, Gripping Voice for Late-Night Audio Narration', g:'Male', age:'Middle aged', use:'Narration', acc:'Standard Hindi', c:4 },
  { n:'Aakash Aryan', d:'Conversational Voice', g:'Male', age:'Young', use:'Conversational', acc:'Mumbai', c:1 },
  { n:'Aakash Aryan', d:'Mystery & Thriller', g:'Male', age:'Young', use:'Storytelling', acc:'Mumbai', c:4 },
  { n:'Aaliyah', d:'Young · Narrative story', g:'Female', age:'Young', use:'Storytelling', acc:'Standard Hindi', c:0 },
  { n:'Aarav R', d:'Natural, Deep Indian Hindi', g:'Male', age:'Middle aged', use:'Narration', acc:'Standard Hindi', c:2 },
  { n:'Aarohi', d:'Calm Hindi Narrator', g:'Female', age:'Middle aged', use:'Narration', acc:'Standard Hindi', c:3 },
];
const STYLES = [['Narration',1240],['Conversational',980],['Calm',612],['Deep',388],['Storytelling',455],['Young',702],['News',141],['Spiritual talk',96]];
const RECENT = [['Rachel',1,'F'],['Aarohi',3,'F'],['Aarav R',2,'M'],['Kabir',0,'M']];

let mock = 'A', playing = -1, picked = 2;

const tag = (t, cls = 'bg-slate-800 text-slate-300') => `<span class="px-1.5 py-[1px] rounded text-[11px] font-medium ${cls}">${t}</span>`;
const hindi = tag('Hindi','bg-cyan-500/10 text-cyan-300');
const av = (v, size = 'w-9 h-9 text-[13px]') => `<span class="av ${size} rounded-full bg-gradient-to-br ${GRAD[v.c]} grid place-items-center font-semibold text-white">${v.n[0]}</span>`;
const bars = (n, seed, on, h = 18) => {
  let s = '';
  for (let i = 0; i < n; i++) {
    const v = 0.25 + 0.75 * Math.abs(Math.sin(seed * 3.7 + i * 0.9) * Math.cos(i * 0.37 + seed));
    s += `<span class="w-[2px] rounded-full ${on && i < n * 0.42 ? 'bg-indigo-400' : 'bg-slate-600'}" style="height:${Math.max(3, v * h)}px"></span>`;
  }
  return `<span class="flex items-center gap-[2px]" style="height:${h}px">${s}</span>`;
};

function header(countText) {
  return `
  <div class="px-5 pt-4 pb-3 border-b border-edge">
    <div class="flex items-start justify-between gap-4">
      <div><div class="text-[16px] font-semibold">Main voice</div>
        <div class="text-[12.5px] text-slate-400 mt-0.5">Your voices first. Search to find any voice in your library; Hindi voices come first.</div></div>
      <div class="flex items-center gap-3">
        <span class="inline-flex rounded-lg bg-slate-900 border border-edge p-0.5 text-[12.5px]"><span class="px-3 py-1 rounded-md bg-indigo-500 font-medium">ElevenLabs</span><span class="px-3 py-1 text-slate-300">Cartesia</span></span>
        <span class="mono text-[11px] text-slate-500 tracking-wider">5,258 VOICES</span>
      </div>
    </div>
    <div class="mt-3 flex items-center gap-2 text-[12.5px]">
      <div class="flex-1 min-w-0 flex items-center gap-2 h-9 px-3 rounded-lg bg-slate-900 border border-edge text-slate-500">${ic('search')}<span class="flex-1 truncate">Search all 5,258 voices</span><span class="mono text-[11px] px-1.5 rounded border border-slate-700">/</span></div>
      <span class="inline-flex rounded-lg bg-slate-900 border border-edge p-0.5"><span class="px-2.5 py-1 rounded-md bg-slate-700 font-medium">All</span><span class="px-2.5 py-1 text-slate-300">Female</span><span class="px-2.5 py-1 text-slate-300">Male</span></span>
      <span class="flex items-center gap-2 px-1"><span class="sw"></span>Indian voices only</span>
      <span class="flex items-center gap-1.5 h-8 px-2.5 rounded-lg border border-edge text-slate-300">${ic('star','w-3.5 h-3.5')}Favourites</span>
      <span class="flex items-center gap-1.5 h-8 px-2.5 rounded-lg border border-edge text-slate-300">${ic('filter','w-3.5 h-3.5')}More filters${ic('chev','w-3.5 h-3.5')}</span>
    </div>
  </div>`;
}

/* ---------- Mock A: two-column cards + "browse by style" shelf ---------- */
function mockA() {
  const card = (v, i) => {
    const on = playing === i, sel = picked === i;
    return `
    <div class="row group relative flex items-center gap-3 p-3 rounded-xl border ${sel ? 'border-indigo-500/70 bg-indigo-950/60' : 'border-edge bg-slate-900/60 hover:bg-slate-800/60'}" data-pick="${i}">
      <button data-play="${i}" class="relative w-9 h-9 shrink-0 grid place-items-center">
        ${av(v)}
        <span class="ply absolute inset-0 rounded-full bg-slate-100 text-slate-900 grid place-items-center">${ic(on ? 'pause' : 'play','w-3.5 h-3.5')}</span>
      </button>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2"><span class="text-[13.5px] font-semibold truncate">${v.n}</span>${sel ? `<span class="text-indigo-300">${ic('check','w-3.5 h-3.5')}</span>` : ''}</div>
        <div class="text-[12px] text-slate-400 truncate">${v.d}</div>
        <div class="mt-1.5 flex items-center gap-1.5 flex-wrap">${hindi}${tag(v.g)}${tag(v.age)}${tag(v.use)}</div>
      </div>
      <div class="w-[92px] shrink-0 flex justify-end ${on ? '' : 'opacity-40'}">${bars(18, i + 1, on)}</div>
      <span class="absolute top-2.5 right-3 text-slate-600 opacity-0 group-hover:opacity-100">${ic('star','w-3.5 h-3.5')}</span>
    </div>`;
  };
  return `
  <section class="flex-1 min-w-0 rounded-2xl border border-edge bg-slate-950 flex flex-col overflow-hidden">
    ${header()}
    <div class="flex-1 overflow-y-auto scroll px-5 py-4">
      <div class="flex items-center justify-between mb-2.5">
        <div class="text-[11px] font-semibold tracking-wider text-slate-500">SUGGESTED FOR HINDI <span class="text-slate-600">8</span></div>
        <div class="text-[11.5px] text-slate-500">Hover a voice to hear it</div>
      </div>
      <div class="grid grid-cols-2 gap-2.5">${VOICES.map(card).join('')}</div>

      <div class="mt-6 grid grid-cols-[1fr_auto] gap-6">
        <div>
          <div class="text-[11px] font-semibold tracking-wider text-slate-500 mb-2.5">BROWSE BY STYLE <span class="font-normal normal-case tracking-normal text-slate-600">· click fills the search</span></div>
          <div class="flex flex-wrap gap-2">${STYLES.map(([s, n]) => `<span class="flex items-center gap-2 h-8 px-3 rounded-full border border-edge bg-slate-900/60 text-[12.5px] text-slate-200 hover:border-slate-600">${s}<span class="mono text-[11px] text-slate-500">${n.toLocaleString()}</span></span>`).join('')}</div>
        </div>
        <div>
          <div class="text-[11px] font-semibold tracking-wider text-slate-500 mb-2.5">RECENTLY USED</div>
          <div class="flex gap-2">${RECENT.map(([n, c, g]) => `<span class="flex items-center gap-2 h-8 pl-1 pr-3 rounded-full border border-edge bg-slate-900/60 text-[12.5px]"><span class="w-6 h-6 rounded-full bg-gradient-to-br ${GRAD[c]} grid place-items-center text-[11px] font-semibold">${n[0]}</span>${n}</span>`).join('')}</div>
        </div>
      </div>
    </div>
    <div class="px-5 py-2.5 border-t border-edge text-[12px] text-slate-500 flex justify-between"><span>8 of 5,258 voices · type to search the rest</span><span class="mono">↑↓ move · Space play · Enter pick</span></div>
  </section>`;
}

/* ---------- Mock B: compact list + big preview pane ---------- */
function mockB() {
  const v = VOICES[picked];
  const row = (x, i) => {
    const sel = picked === i, on = playing === i;
    return `
    <div class="row ${sel ? 'sel' : ''} flex items-center gap-3 px-3 py-2 rounded-lg ${sel ? 'bg-indigo-950 ring-1 ring-indigo-500/60' : 'hover:bg-slate-800/60'}" data-pick="${i}">
      <button data-play="${i}" class="relative w-8 h-8 shrink-0 grid place-items-center">
        ${av(x, 'w-8 h-8 text-[12px]')}
        <span class="ply absolute inset-0 rounded-full bg-slate-100 text-slate-900 grid place-items-center">${ic(on ? 'pause' : 'play','w-3 h-3')}</span>
      </button>
      <div class="min-w-0 flex-1">
        <div class="text-[13px] font-semibold truncate">${x.n}</div>
        <div class="text-[11.5px] text-slate-400 truncate">${x.d}</div>
      </div>
      <span class="flex gap-1">${hindi}${tag(x.g)}</span>
    </div>`;
  };
  const similar = [VOICES[6], VOICES[0], VOICES[7]].filter(x => x !== v).slice(0, 3);
  const on = playing === picked;
  return `
  <section class="flex-1 min-w-0 rounded-2xl border border-edge bg-slate-950 flex flex-col overflow-hidden">
    ${header()}
    <div class="flex-1 min-h-0 flex">
      <div class="w-[46%] shrink-0 flex flex-col border-r border-edge">
        <div class="flex-1 overflow-y-auto scroll px-3 py-3">
          <div class="px-2 mb-1.5 text-[11px] font-semibold tracking-wider text-slate-500">SUGGESTED FOR HINDI <span class="text-slate-600">8</span></div>
          ${VOICES.map(row).join('')}
          <div class="px-2 mt-4 mb-1.5 text-[11px] font-semibold tracking-wider text-slate-500">RECENTLY USED</div>
          ${[{ n:'Rachel', d:'Female · American', g:'Female', c:1 }].map(x => `<div class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800/60">${av(x,'w-8 h-8 text-[12px]')}<div class="min-w-0 flex-1"><div class="text-[13px] font-semibold">${x.n}</div><div class="text-[11.5px] text-slate-400">${x.d}</div></div><span class="text-[11px] text-indigo-300">Main voice now</span></div>`).join('')}
        </div>
        <div class="px-5 py-2.5 border-t border-edge text-[12px] text-slate-500">8 of 5,258 voices · type to search the rest</div>
      </div>

      <div class="flex-1 min-w-0 overflow-y-auto scroll p-6 flex flex-col">
        <div class="flex items-start gap-4">
          <span class="w-16 h-16 rounded-2xl bg-gradient-to-br ${GRAD[v.c]} grid place-items-center text-[24px] font-semibold">${v.n[0]}</span>
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2"><span class="text-[19px] font-semibold">${v.n}</span><span class="text-slate-500 hover:text-amber-300">${ic('star','w-4 h-4')}</span></div>
            <div class="text-[13px] text-slate-400 mt-0.5">${v.d}</div>
            <div class="mt-2 flex gap-1.5">${hindi}${tag(v.g)}${tag(v.age)}</div>
          </div>
        </div>

        <div class="mt-5 rounded-xl border border-edge bg-slate-900/70 p-4">
          <div class="flex items-center gap-3">
            <button data-play="${picked}" class="w-10 h-10 rounded-full bg-slate-100 text-slate-900 grid place-items-center">${ic(on ? 'pause' : 'play','w-4 h-4')}</button>
            <div class="flex-1 min-w-0">${bars(64, picked + 2, on, 28)}</div>
            <span class="mono text-[11.5px] text-slate-500">${on ? '0:04' : '0:00'} / 0:11</span>
          </div>
          <div class="mt-3 flex items-center gap-2 text-[12px]">
            <span class="px-2.5 py-1 rounded-md bg-slate-700 font-medium">Sample</span>
            <span class="px-2.5 py-1 rounded-md text-slate-300 border border-edge flex items-center gap-1.5">${ic('text','w-3.5 h-3.5')}Read my first line</span>
            <span class="ml-auto text-slate-500">My line uses a few credits</span>
          </div>
        </div>

        <dl class="mt-5 grid grid-cols-2 gap-x-6 gap-y-3 text-[12.5px]">
          ${[['Accent', v.acc], ['Best for', v.use], ['Age', v.age], ['Language', 'Hindi · also reads English']].map(([k, val]) => `<div><dt class="text-slate-500 text-[11.5px]">${k}</dt><dd class="text-slate-200 mt-0.5">${val}</dd></div>`).join('')}
        </dl>

        <div class="mt-5">
          <div class="text-[11px] font-semibold tracking-wider text-slate-500 mb-2">SOUNDS SIMILAR</div>
          <div class="grid grid-cols-3 gap-2">${similar.map(x => `<div class="flex items-center gap-2 p-2 rounded-lg border border-edge bg-slate-900/50">${av(x,'w-7 h-7 text-[11px]')}<div class="min-w-0"><div class="text-[12.5px] font-medium truncate">${x.n}</div><div class="text-[11px] text-slate-500 truncate">${x.use}</div></div></div>`).join('')}</div>
        </div>

        <div class="mt-auto pt-5 flex items-center gap-2">
          <button class="h-10 px-5 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-[13.5px] font-semibold">Use for Main voice</button>
          <span class="text-[12px] text-slate-500">Replaces Rachel for Host and Guest</span>
        </div>
      </div>
    </div>
  </section>`;
}

/* ---------- right column (same in both, small tweak noted) ---------- */
function right() {
  const tryLine = mock === 'A' ? `
    <div class="mx-4 mt-3 rounded-xl border border-edge p-3">
      <div class="text-[11.5px] text-slate-400 mb-2">Hear the main voice on your script</div>
      <div class="text-[12.5px] text-slate-200 leading-snug line-clamp-2">"जब आप अपने भीतर शांत होते हैं, तो बाहर की हर चीज़…"</div>
      <div class="mt-2 flex items-center gap-2"><button class="h-7 px-2.5 rounded-md bg-slate-800 text-[12px] flex items-center gap-1.5">${ic('play','w-3 h-3')}Line 1</button><span class="text-[11px] text-slate-500">a few credits</span></div>
    </div>` : '';
  return `
  <aside class="w-[384px] shrink-0 rounded-2xl border border-edge bg-slate-950 flex flex-col overflow-hidden text-[13px]">
    <div class="p-4 border-b border-edge">
      <div class="grid grid-cols-[1fr_auto_1fr] gap-2 items-end">
        <div><div class="text-[12px] text-slate-400 mb-1.5">Spoken in</div><div class="h-11 px-3 rounded-lg bg-slate-900 border border-edge flex items-center justify-between">Auto detect${ic('chev','w-4 h-4 text-slate-500')}</div></div>
        <div class="h-11 w-10 rounded-lg border border-edge grid place-items-center text-slate-600">${ic('swap','w-4 h-4')}</div>
        <div><div class="text-[12px] text-slate-400 mb-1.5">Dub into</div><div class="h-11 px-3 rounded-lg bg-slate-900 border border-edge flex items-center justify-between">Hindi (हिन्दी)${ic('chev','w-4 h-4 text-slate-500')}</div></div>
      </div>
      <div class="text-[12px] text-slate-500 mt-2">Auto detect works for most talks. Set the language when speakers mix languages.</div>
    </div>
    <div class="p-4 border-b border-edge">
      <div class="flex items-center justify-between"><span class="font-semibold">Speakers</span>
        <span class="inline-flex rounded-lg border border-edge p-0.5 text-[12.5px]"><span class="px-2.5 py-1 rounded-md bg-slate-700">1</span><span class="px-2.5 py-1 text-slate-300">2</span><span class="px-2.5 py-1 text-slate-300">3</span><span class="px-2.5 py-1 text-slate-300">4+</span><span class="px-2.5 py-1 text-slate-300">Detect</span></span></div>
      <div class="text-[12px] text-slate-500 mt-2">This transcript has 2 speakers. The setting here is for the next transcription.</div>
    </div>
    <div class="flex-1 min-h-0 overflow-y-auto scroll flex flex-col">
      <div class="px-4 pt-3 text-[11px] font-semibold tracking-wider text-slate-500">CAST</div>
      <div class="mx-3 mt-2 p-2.5 rounded-xl border border-indigo-500/60 bg-indigo-950/50">
        <div class="text-[11px] text-slate-400">Main voice · anyone without their own</div>
        <div class="mt-1 flex items-center gap-2"><span class="w-5 h-5 rounded-full bg-gradient-to-br ${GRAD[1]} grid place-items-center text-[10px] font-semibold">R</span><span class="font-medium">Rachel</span><span class="text-[12px] text-slate-500">· Female · American</span></div>
      </div>
      <div class="px-4 py-2 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-violet-400"></span><span class="font-semibold">Host</span><span class="text-[11px] text-slate-500">63%</span><span class="ml-auto text-[12px] text-slate-500">Main voice</span></div>
      <div class="px-4 py-2 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-teal-400"></span><span class="font-semibold">Guest</span><span class="text-[11px] text-slate-500">37%</span><span class="ml-auto text-[12px] text-slate-500">Main voice</span></div>
      <div class="px-4 text-[12px] text-amber-300 leading-snug">Guest (1 line) shares a voice with Host, so they will sound alike. Pick Guest and give them their own voice.</div>
      ${tryLine}
      <div class="mx-4 ${mock === 'B' ? 'mt-auto' : 'mt-3'} mb-4 ${mock === 'B' ? '' : ''} rounded-xl border border-edge p-3 flex items-center gap-3">
        ${ic('gauge','w-4 h-4 text-slate-400')}
        <div class="flex-1 min-w-0"><div class="text-[11.5px] text-slate-500">Speaking rate in Hindi</div><div class="flex items-center gap-2"><span class="font-semibold">5.8 syllables/s</span><span class="px-1.5 rounded text-[11px] bg-amber-500/15 text-amber-300">Fast</span></div><div class="text-[11px] text-slate-500 truncate">From a short sample read · 15 Nov 2026</div></div>
        <span class="w-8 h-8 rounded-lg border border-edge grid place-items-center text-slate-400">${ic('refresh','w-3.5 h-3.5')}</span>
      </div>
    </div>
  </aside>`;
}

const NOTES = {
  A: '<b>Mock A — দুই কলামে কার্ড + স্টাইল তাক।</b> ৮টা voice এখন দুই কলামে কার্ড হয়ে পুরো চওড়া নেয় — প্রতিটায় বয়স/কাজের ট্যাগ আর ছোট wave, hover করলে avatar-এর জায়গায় ▶ (শুনতে আলাদা click লাগে না)। নিচে <b>Browse by style</b> (Narration, Calm, Deep…, কত voice আছে সংখ্যা সহ — click করলে search ভরে যায়) আর <b>Recently used</b>। ডান কলামে Cast-এর নিচে "Hear the main voice on your script" — script-এর প্রথম লাইন বেছে নেওয়া voice-এ শোনা।',
  B: '<b>Mock B — বাঁয়ে তালিকা, ডানে voice-এর বড় preview।</b> তালিকা সরু হয়ে বাঁ দিকে (ট্যাগ নামের পাশে, মাঝে ফাঁকা নেই); ডান দিকের ফাঁকা জায়গায় যে voice-টা বাছা আছে তার বড় কার্ড — sample wave + ▶, "Read my first line", accent/বয়স/কীসের জন্য ভালো, <b>Sounds similar</b> তিনটে, আর নিচে <b>Use for Main voice</b> বোতাম। তালিকায় click = preview বদলায়, বোতাম = cast-এ বসায়। ডান কলামে Speaking rate কার্ড নিচে আটকানো, তাই ফাঁকটা মাঝখানে থাকে, শেষে নয়।',
};

function render() {
  document.getElementById('mockSeg').innerHTML = ['A','B'].map(m => `<button data-mock="${m}" class="px-3 py-1 ${m === mock ? 'bg-indigo-500 text-white' : 'text-slate-300 hover:bg-slate-800'}">${m === 'A' ? 'A · দুই কলামে কার্ড' : 'B · তালিকা + preview'}</button>`).join('');
  document.getElementById('note').innerHTML = NOTES[mock];
  document.getElementById('frame').innerHTML = (mock === 'A' ? mockA() : mockB()) + right();
}
document.addEventListener('click', e => {
  const m = e.target.closest('[data-mock]'); if (m) { mock = m.dataset.mock; playing = -1; render(); return; }
  const p = e.target.closest('[data-play]'); if (p) { const i = +p.dataset.play; playing = playing === i ? -1 : i; if (mock === 'B') picked = i; render(); return; }
  const r = e.target.closest('[data-pick]'); if (r) { picked = +r.dataset.pick; render(); }
});
render();
</script>
</body>
</html>

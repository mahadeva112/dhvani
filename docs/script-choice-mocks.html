<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Script Choice Mocks</title>
<script src="https://cdn.tailwindcss.com/3.4.10"></script>
<script>
  // Graphite, as index.css swaps it.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          slate: { 50:'#f6f6f7',100:'#ececef',200:'#dcdde1',300:'#c6c8ce',400:'#abadb5',500:'#8b8e98',600:'#5a5d66',700:'#34363c',800:'#232529',900:'#18191c',950:'#111214' },
          indigo: { 300:'#a5adf5',400:'#7b86ec',500:'#5866e0',600:'#4c59d0',950:'#23253a' },
          edge: '#27292d',
        },
      },
    },
  };
</script>
<style>
  html, body { overflow-x: clip; }
  body { background:#111214; font-family: Inter, system-ui, "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .scroll::-webkit-scrollbar { width:8px } .scroll::-webkit-scrollbar-thumb { background:#34363c; border-radius:8px } .scroll::-webkit-scrollbar-track { background:transparent }
  .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg) } }
  .sw { width:30px; height:17px; border-radius:999px; background:#34363c; position:relative; flex-shrink:0; transition:background .15s; }
  .sw::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#ececef; transition:left .15s; }
  .sw.on { background:#5866e0; } .sw.on::after { left:15px; }
  .pop { box-shadow: 0 18px 40px -12px rgba(0,0,0,.7); }
  .fill-in { animation: fillin .35s ease; } @keyframes fillin { from { opacity:0; transform:translateY(2px) } to { opacity:1; transform:none } }
  select { cursor:default; }
  button { cursor:default; }
</style>
</head>
<body class="text-slate-100 min-h-screen p-4 sm:p-6">

<!-- Switchers -->
<div class="max-w-[90rem] mx-auto mb-2 flex flex-wrap items-center gap-2 text-[12.5px] text-slate-400">
  <span class="px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-300 font-medium">Mock</span>
  <span id="mockSeg" class="inline-flex flex-wrap rounded-lg border border-edge overflow-hidden"></span>
</div>
<div class="max-w-[90rem] mx-auto mb-2 flex flex-wrap items-center gap-2 text-[12.5px] text-slate-400">
  <span class="px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-medium">অবস্থা</span>
  <span id="stateSeg" class="inline-flex flex-wrap rounded-lg border border-edge overflow-hidden"></span>
</div>
<p id="note" class="max-w-[90rem] mx-auto mb-4 text-[13.5px] text-slate-300 leading-relaxed"></p>

<div class="max-w-[90rem] mx-auto">
  <!-- App bar and steps, for context -->
  <div class="flex flex-wrap items-center gap-2 mb-3 text-[13px] min-h-[36px]">
    <span class="text-slate-500">1 Source &amp; voice</span><span class="text-slate-600">›</span>
    <span class="text-slate-100 font-semibold">2 Review</span><span class="text-slate-600">›</span>
    <span class="text-slate-500">3 Dub</span>
    <div class="flex-1"></div>
    <span class="text-slate-500 text-[12px]">sadhguru_energy_talk.mp4</span>
  </div>

  <!-- Review player (only the original lane while no script exists) -->
  <div id="player" class="mb-4 bg-slate-900/90 border border-edge rounded-2xl px-4 py-3"></div>

  <div id="main"></div>
</div>

<script>
const ICON = {
  languages: '<path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>',
  paste: '<path d="M15 2H9a1 1 0 0 0-1 1v2c0 .6.4 1 1 1h6c.6 0 1-.4 1-1V3c0-.6-.4-1-1-1Z"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2M16 4h2a2 2 0 0 1 2 2v2M11 14h10"/><path d="m17 10 4 4-4 4"/>',
  zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  scissors: '<circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  spin: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  sliders: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  pen: '<path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/>',
  list: '<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
};
const ic = (n, c = 'w-4 h-4') => `<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

// Transcript: start, length, English, Hindi (used by the translating / paste previews).
const T = [
  [0.0,3.1,'Thank you all for coming this evening.','आज शाम आप सब के आने के लिए धन्यवाद।'],
  [3.4,4.2,'What we call life is just a certain amount of energy.','जिसे हम जीवन कहते हैं, वह बस कुछ ऊर्जा है।'],
  [7.9,2.6,'How you use it is up to you.','आप उसे कैसे इस्तेमाल करें, यह आप पर है।'],
  [10.8,3.8,'Most people spend it on things that do not matter.','ज़्यादातर लोग उसे ऐसी चीज़ों पर खर्च करते हैं जो मायने नहीं रखतीं।'],
  [14.9,2.2,'Then they wonder where it went.','फिर सोचते हैं कि वह कहाँ गई।'],
  [17.4,3.5,'If you sit quietly for a few minutes every day,','अगर आप रोज़ कुछ मिनट शांति से बैठें,'],
  [21.1,3.0,'you will see how much is wasted.','तो देखेंगे कि कितना बर्बाद होता है।'],
  [24.5,1.6,'Just watch.','बस देखिए।'],
  [26.4,4.4,'Do not try to fix anything in the beginning.','शुरुआत में कुछ भी ठीक करने की कोशिश मत कीजिए।'],
  [31.0,2.9,'Watching itself will change things.','देखना ही चीज़ों को बदल देगा।'],
  [34.2,3.6,'This is not a belief, this is something you can try.','यह कोई मान्यता नहीं, यह आप आज़मा सकते हैं।'],
  [38.1,2.4,'Try it for thirty days.','तीस दिन आज़माइए।'],
  [40.8,4.0,'If nothing changes, you can throw it away.','अगर कुछ न बदले, तो छोड़ दीजिए।'],
  [45.1,3.3,'But I know it will change.','पर मैं जानता हूँ कि बदलेगा।'],
  [48.7,2.8,'Because that is the nature of life.','क्योंकि जीवन का स्वभाव यही है।'],
  [51.8,3.9,'It responds to attention.','वह ध्यान का जवाब देता है।'],
];
const ESTIMATED = new Set([7]);
const LANGS = ['Hindi','Bangla','Tamil','Telugu','Marathi','Gujarati','Kannada','Malayalam','English'];
const STYLES = [['sadhguru','Sadhguru'],['natural','Natural Spoken'],['my_ashram','Ashram talks (mine)']];
const fmt = (s) => { const m = Math.floor(s / 60); return `${m}:${(s % 60).toFixed(1).padStart(4, '0')}`; };
const LEN = '0:56';

const MOCKS = {
  A: { label: 'Mock A · দুটো কার্ড, যার যার বোতাম', note: 'এখনকার layout রাখা (বাঁয়ে transcript, ডানে পাশের অংশ), কিন্তু radio + নিচের Continue নেই। প্রতিটা পথ একটা কার্ড, তার নিজের বোতাম। Translate কার্ডের ভিতরেই style আর voice-speed; Fast টা মূল বোতামের পাশে ছোট। Paste কার্ডে Ctrl+V-র জায়গা — পেস্ট করলেই এখনকার align window খোলে।' },
  B: { label: 'Mock B · পাশাপাশি কলাম', note: 'পুরো চওড়া একটা টেবিল: English | Hindi। Hindi কলাম ফাঁকা থাকে, উপরের বারে Translate (▾ তে Fast) আর Paste script। Translate চললে Hindi কলাম লাইন ধরে ভরে ওঠে — দেখা যায় script কোথায় বসবে। পরে Review-এ যাওয়ার সময় চেহারা প্রায় একই থাকে।' },
  C: { label: 'Mock C · মাঝখানে শুরু', note: 'একটা শান্ত শুরু-পাতা: উপরে "Transcript ready", বড় করে "Dub into Hindi", তারপর দুটো বড় টাইল — "Translate for me" / "I have a Hindi script"। নতুনদের জন্য সবচেয়ে সহজ। Transcript নিচে, ৬ লাইন দেখায়, "Show all" এ খোলে।' },
  D: { label: 'Mock D · ট্যাব + সরাসরি paste', note: 'ডানে দুটো ট্যাব: Translate | My script। My script-এ পেস্ট-বক্স এখানেই — পেস্ট করলেই বাঁয়ের transcript-এর প্রতিটা লাইনের নিচে Hindi লাইন সবুজে দেখায় (জোড়া মেলানোর আগাম দেখা)। Translate ট্যাবে style তালিকা, Full / Fast বেছে নেওয়া, voice-speed — একটাই বোতাম। "Try sample" চাপলে পেস্টের নমুনা দেখবে।' },
};
const STATES = { ready: 'তৈরি', translating: 'Translate চলছে · 42%', noengine: 'Engine নেই', same: 'একই ভাষা (English)' };

const S = { mock: 'A', state: 'ready', lang: 'Hindi', style: 'sadhguru', fit: true, fast: false, menu: false, showAll: false, tab: 'translate', pasted: '' };
try { const saved = JSON.parse(localStorage.getItem('scriptChoiceMock') || '{}'); if (saved.mock) S.mock = saved.mock; } catch {}

const target = () => (S.state === 'same' ? 'English' : S.lang);
const same = () => S.state === 'same';
const busy = () => S.state === 'translating';
const noEngine = () => S.state === 'noengine';
const styleName = () => STYLES.find(([id]) => id === S.style)[1];
const DONE = 7; // lines filled while "translating"

// ---------- shared pieces ----------
function renderPlayer() {
  let bars = '';
  let seed = 7;
  for (let i = 0; i < 220; i++) {
    seed = (seed * 9301 + 49297) % 233280;
    const t = (i / 220) * 56;
    const inCue = T.some(([s, d]) => t >= s && t <= s + d);
    const h = inCue ? 18 + (seed / 233280) * 70 : 4 + (seed / 233280) * 8;
    bars += `<span style="height:${h}%" class="flex-1 rounded-sm ${i === 38 ? 'bg-slate-100' : i < 38 ? 'bg-slate-400' : 'bg-slate-600'}"></span>`;
  }
  const cues = T.map(([s, d], i) => `<span title="${i + 1}" class="absolute top-0 bottom-0 rounded-[3px] ${i === 1 ? 'bg-indigo-500/45' : 'bg-slate-700/70'}" style="left:${(s / 56) * 100}%;width:${(d / 56) * 100}%"></span>`).join('');
  document.getElementById('player').innerHTML = `
    <div class="flex items-center gap-3">
      <button class="w-9 h-9 rounded-full bg-slate-100 text-slate-900 flex items-center justify-center">${ic('play', 'w-4 h-4 ml-0.5')}</button>
      <span class="mono text-[12px] text-slate-300">0:09.6 <span class="text-slate-500">/ ${LEN}</span></span>
      <span class="text-[11.5px] text-slate-500">Original</span>
      <div class="flex-1"></div>
      <span class="text-[11.5px] text-slate-500">Dub lane appears once there's a script</span>
    </div>
    <div class="mt-2 h-12 flex items-center gap-[2px]">${bars}</div>
    <div class="mt-1 relative h-2">${cues}</div>`;
}

function langSelect(cls = '') {
  return `<div class="relative ${cls}">
    <select data-act="lang" ${busy() || same() ? 'disabled' : ''} class="appearance-none w-full h-9 bg-slate-950 border border-edge hover:border-slate-600 rounded-lg pl-2.5 pr-8 text-[13px] font-medium text-slate-100 focus:outline-none focus:border-indigo-500 disabled:opacity-60">
      ${LANGS.map((l) => `<option ${l === target() ? 'selected' : ''} class="bg-slate-900">${l}</option>`).join('')}
    </select>
    <span class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500">${ic('chev')}</span>
  </div>`;
}

const chip = (txt, tone) => {
  const tones = { amber: 'bg-amber-500/15 text-amber-300', green: 'bg-emerald-500/15 text-emerald-300', grey: 'bg-slate-800 text-slate-300' };
  return `<span class="text-[10.5px] font-semibold px-2 py-0.5 rounded-full ${tones[tone]}">${txt}</span>`;
};

const toolBtn = (icon, label, title) =>
  `<button ${busy() ? 'disabled' : ''} title="${title}" class="h-8 px-2.5 flex items-center gap-1.5 rounded-lg border border-edge bg-slate-950 hover:bg-slate-800 text-[12px] font-medium text-slate-200 disabled:opacity-40">${ic(icon, 'w-3.5 h-3.5 text-slate-400')}${label}</button>`;

function transcriptHead(extra = '') {
  return `<div class="flex flex-wrap items-center gap-2.5 px-4 py-3 border-b border-edge">
    ${ic('file', 'w-4 h-4 text-slate-400')}
    <h2 class="text-[14px] font-semibold text-slate-100">Transcript</h2>
    <span class="text-xs text-slate-400 mono">${T.length} segments · ${LEN} · English</span>
    ${extra}
    <div class="ml-auto flex items-center gap-2">
      ${toolBtn('scissors', 'Edit segments', 'Split or merge segments before you translate. Optional. Or play to a point and press S.')}
      ${toolBtn('download', 'Export', 'Save the transcript as SRT, VTT, TXT or a script file')}
    </div>
  </div>`;
}

function timeCell(i) {
  const [s, d] = T[i];
  const est = ESTIMATED.has(i);
  return `<span class="mono text-[11px] ${est ? 'text-amber-300' : 'text-slate-400'}">${fmt(s)}–${fmt(s + d)}${est ? '<span class="block text-[9.5px] font-sans font-semibold text-amber-300/80">estimated</span>' : ''}</span>`;
}

function pastedLines() {
  return S.pasted.split('\n').map((l) => l.trim()).filter(Boolean);
}

function transcriptRows({ limit = T.length, preview = false } = {}) {
  const lines = preview ? pastedLines() : [];
  return T.slice(0, limit).map(([, , en], i) => {
    const on = i === 1;
    const p = lines[i];
    return `<li><button class="w-full grid grid-cols-[2rem_7.5rem_minmax(0,1fr)] gap-2.5 items-baseline px-4 py-2.5 text-left ${on ? 'bg-indigo-500/10' : 'hover:bg-slate-800/40'}" title="Play from here">
      <span class="mono text-[11px] text-slate-500">${String(i + 1).padStart(2, '0')}</span>
      ${timeCell(i)}
      <span class="min-w-0">
        <span class="block text-[13px] leading-snug text-slate-200">${en}</span>
        ${preview && p ? `<span class="fill-in block mt-1 text-[13px] leading-snug text-emerald-200/90">${p}</span>` : ''}
        ${preview && S.pasted && !p ? `<span class="block mt-1 text-[11.5px] italic text-amber-300/80">No line for this cue yet</span>` : ''}
      </span>
    </button></li>`;
  }).join('');
}

function transcriptCard({ cls = '', preview = false } = {}) {
  return `<section class="flex flex-col min-h-0 bg-slate-900/90 border border-edge rounded-2xl overflow-hidden ${cls}">
    ${transcriptHead(preview && S.pasted ? `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300">Preview of your script</span>` : '')}
    <ol class="flex-1 min-h-0 overflow-y-auto scroll divide-y divide-slate-800/70">${transcriptRows({ preview })}</ol>
  </section>`;
}

function engineLine() {
  if (noEngine()) {
    return `<div class="flex items-start gap-2 p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/25 text-[12px] text-amber-200">
      ${ic('alert', 'w-4 h-4 mt-px text-amber-300')}
      <span class="flex-1">No translation engine is set up. Add one, or use your own script.</span>
      <button class="px-2 py-0.5 rounded-md border border-amber-500/40 text-[11.5px] font-medium text-amber-200 hover:bg-amber-500/10">API settings</button>
    </div>`;
  }
  return '';
}

function fitRow(compact = false) {
  if (same()) return '';
  return `<button data-act="fit" ${busy() ? 'disabled' : ''} class="w-full flex items-start gap-2.5 text-left disabled:opacity-60">
    <span class="sw ${S.fit ? 'on' : ''} mt-0.5"></span>
    <span class="min-w-0 flex-1">
      <span class="flex items-center gap-1.5 text-[12.5px] font-medium text-slate-100">Fit to the voice's speed</span>
      ${compact ? '' : `<span class="block text-[11px] text-slate-500 leading-snug mt-0.5">Priya speaks ${target()} at 4.6 syllables/s. Each line is sized to what she can say in the speaker's time.</span>`}
    </span>
  </button>`;
}

function progress(label = 'Translating') {
  return `<div class="flex flex-col gap-2">
    <div class="flex items-center gap-2 text-[12.5px] text-slate-200">${ic('spin', 'w-4 h-4 spin text-indigo-300')}<span>${label} · ${DONE} of ${T.length} lines</span><span class="ml-auto mono text-slate-400">42%</span></div>
    <div class="h-1.5 rounded-full bg-slate-800 overflow-hidden"><div class="h-full bg-indigo-500" style="width:42%"></div></div>
    <button data-act="cancel" class="h-9 flex items-center justify-center gap-2 rounded-xl border border-slate-700 hover:bg-slate-800 text-slate-200 text-[13px] font-medium" title="Stop the translation. Nothing it did is applied; the transcript stays as it is.">${ic('x')} Cancel translation</button>
  </div>`;
}

const primary = (label, { icon = 'arrow', after = true, disabled = false, act = '', cls = 'h-11' } = {}) =>
  `<button data-act="${act}" ${disabled ? 'disabled' : ''} class="${cls} px-4 flex items-center justify-center gap-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold disabled:bg-slate-800 disabled:text-slate-500 active:translate-y-px">${after ? '' : ic(icon)}<span>${label}</span>${after ? ic(icon) : ''}</button>`;
const secondary = (label, { icon = '', disabled = false, act = '', cls = 'h-11', title = '' } = {}) =>
  `<button data-act="${act}" title="${title}" ${disabled ? 'disabled' : ''} class="${cls} px-3.5 flex items-center justify-center gap-2 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 text-slate-100 text-sm font-medium disabled:text-slate-500 disabled:hover:bg-slate-900 active:translate-y-px">${icon ? ic(icon) : ''}<span>${label}</span></button>`;

const translateLabel = () => (same() ? `Use the ${target()} transcript` : `Translate to ${target()}`);
const sendsLine = () => (same() ? 'Nothing is sent anywhere.' : `Sends ${T.length} lines to Your gateway — gpt-4.1.`);

// ---------- Mock A ----------
function mockA() {

      </div>
      <div class="px-4 pb-3">
        <div class="flex bg-slate-950 border border-edge rounded-xl p-0.5 gap-0.5">${tab('translate', same() ? 'Use transcript' : 'Translate', 'languages')}${tab('custom', 'My script', 'paste')}</div>
      </div>
      <div class="px-4 pb-4 flex flex-col gap-3.5 overflow-y-auto scroll min-h-0">${S.tab === 'translate' ? translateBody : pasteBody}</div>
      <div class="mt-auto px-4 py-4 border-t border-edge bg-slate-950/60 flex flex-col gap-2">${footer}</div>
    </aside>
  </div>`;
}

// ---------- wiring ----------
function render() {
  try { localStorage.setItem('scriptChoiceMock', JSON.stringify({ mock: S.mock })); } catch {}
  document.getElementById('mockSeg').innerHTML = Object.entries(MOCKS).map(([k, m]) =>
    `<button data-mock="${k}" class="px-3 py-1 ${S.mock === k ? 'bg-slate-800 text-slate-100' : 'hover:text-slate-200'}">${m.label}</button>`).join('');
  document.getElementById('stateSeg').innerHTML = Object.entries(STATES).map(([k, l]) =>
    `<button data-state="${k}" class="px-3 py-1 ${S.state === k ? 'bg-slate-800 text-slate-100' : 'hover:text-slate-200'}">${l}</button>`).join('');
  document.getElementById('note').textContent = MOCKS[S.mock].note;
  document.getElementById('main').innerHTML = { A: mockA, B: mockB, C: mockC, D: mockD }[S.mock]();
}

document.addEventListener('click', (e) => {
  const m = e.target.closest('[data-mock]');
  if (m) { S.mock = m.dataset.mock; S.menu = false; return render(); }
  const st = e.target.closest('[data-state]');
  if (st) { S.state = st.dataset.state; S.menu = false; if (S.state !== 'same' && S.lang === 'English') S.lang = 'Hindi'; if (S.state === 'translating') S.tab = 'translate'; return render(); }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) { if (S.menu) { S.menu = false; render(); } return; }
  const act = a.dataset.act;
  if (act === 'fit') S.fit = !S.fit;
  else if (act === 'menu') { S.menu = !S.menu; return render(); }
  else if (act === 'pickFast') S.fast = true;
  else if (act === 'pickFull') S.fast = false;
  else if (act === 'cycleStyle') S.style = STYLES[(STYLES.findIndex(([id]) => id === S.style) + 1) % STYLES.length][0];
  else if (act === 'style') S.style = a.dataset.style;
  else if (act === 'cancel') S.state = 'ready';
  else if (act === 'showAll') S.showAll = !S.showAll;
  else if (act === 'tab') S.tab = a.dataset.tab;
  else if (act === 'sample') S.pasted = S.pasted ? '' : T.slice(0, 14).map((r) => r[3]).join('\n');
  else return;
  S.menu = false;
  render();
});
document.addEventListener('change', (e) => {
  if (e.target.dataset.act === 'lang') { S.lang = e.target.value; if (S.lang === 'English') S.state = 'same'; render(); }
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.act !== 'paste') return;
  S.pasted = e.target.value;
  const pos = e.target.selectionStart;
  render();
  const ta = document.querySelector('textarea[data-act="paste"]');
  if (ta) { ta.focus(); ta.setSelectionRange(pos, pos); }
});

renderPlayer();
render();
</script>
</body>
</html>

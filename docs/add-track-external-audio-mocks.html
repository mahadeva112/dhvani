<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Add Track Mocks</title>
<script src="https://cdn.tailwindcss.com/3.4.10"></script>
<style>
  html, body { overflow-x: clip; }
  body { background:#06080d; font-family: Inter, system-ui, "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif; }
  .edge { border-color:#232a36; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .tool { height:32px; padding:0 10px; border-radius:9px; color:#cbd5e1; font-size:12px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .tool.on { background:#1e2433; color:#fff; }
  .grp { display:flex; gap:2px; border:1px solid #232a36; border-radius:12px; background:#020617; padding:2px; }
  .chip { font-size:11.5px; font-weight:600; padding:2px 10px; border-radius:999px; }
  .ms { font-size:10px; width:20px; height:18px; border:1px solid #334155; border-radius:5px; color:#94a3b8; display:inline-flex; align-items:center; justify-content:center; }
  .fader { position:relative; height:4px; border-radius:4px; background:#1e293b; flex:1; }
  .fader i { position:absolute; top:-4px; width:10px; height:12px; border-radius:3px; background:#cbd5e1; }
  .new { box-shadow: 0 0 0 2px #22d3ee99; border-radius:10px; }
  .hide-new .new { box-shadow:none; }
  .btn { height:30px; padding:0 11px; border:1px solid #334155; border-radius:9px; color:#cbd5e1; font-size:12px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; background:#0f141d; }
  .pri { background:#6366f1; border-color:#818cf8; color:#fff; font-weight:600; }
  .radio { display:flex; align-items:flex-start; gap:9px; padding:8px 10px; border:1px solid #232a36; border-radius:10px; background:#0b0f16; font-size:12.5px; color:#cbd5e1; }
  .radio.sel { border-color:#6366f1; background:#141a2b; }
  .dot { width:14px; height:14px; border-radius:999px; border:1.5px solid #475569; margin-top:2px; flex:none; position:relative; }
  .sel .dot { border-color:#818cf8; }
  .sel .dot::after { content:""; position:absolute; inset:2.5px; border-radius:999px; background:#818cf8; }
  .menu { background:#0f172a; border:1px solid #334155; border-radius:12px; padding:6px; box-shadow:0 18px 40px #000a; font-size:12.5px; color:#cbd5e1; }
  .menu div { padding:6px 10px; border-radius:7px; display:flex; align-items:center; gap:9px; }
  .menu div.hi { background:#1e293b; color:#fff; }
  .menu .k { margin-left:auto; font-family:ui-monospace,Consolas,monospace; font-size:10.5px; color:#64748b; }
  #stage { width:1500px; transform-origin: top left; position:relative; }
  svg { display:block; }
</style>
</head>
<body class="text-slate-100 min-h-screen p-3 sm:p-5">
<div class="max-w-[1500px] mx-auto">
  <div class="flex flex-wrap items-center gap-2 mb-2 text-[13px]">
    <span class="px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-300 font-medium">Mock</span>
    <div id="tabs" class="inline-flex flex-wrap rounded-lg border edge overflow-hidden"></div>
    <label class="ml-2 inline-flex items-center gap-1.5 text-slate-400"><input id="marks" type="checkbox" checked /> যা নতুন, নীল দাগে দেখাও</label>
  </div>
  <p id="note" class="text-[13.5px] text-slate-300 mb-3 leading-relaxed max-w-[95rem]"></p>
  <div id="wrap" style="position:relative"><div id="stage"></div></div>
  <div id="after" class="mt-4"></div>
</div>

<script>
// ---------- helpers ----------
const ICON = {
  mic:'<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>',
  scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>',
  magnet:'<path d="m6 15-4-4 6.8-6.8a6 6 0 0 1 8.5 8.5L10.5 19.5l-4-4M5 8l4 4M12 15l4 4"/>',
  ripple:'<path d="M17 12H3M11 18l6-6-6-6M21 5v14"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
  hist:'<path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>',
  zin:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/>',
  zout:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M8 11h6"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  fileaudio:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><circle cx="10" cy="16" r="2"/><path d="M12 16v-5l3 1"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  dots:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  reset:'<path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5"/>',
  play:'<path d="m6 4 14 8-14 8z"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  pen:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  up:'<path d="m18 15-6-6-6 6"/>', down:'<path d="m6 9 6 6 6-6"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  maxi:'<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
  wave:'<path d="M2 12h2M6 8v8M10 5v14M14 8v8M18 10v4M22 12h0"/>',
};
const ic = (n, s=16, cls='') => `<svg class="${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function wave(w, h, color, density = 1, level = 0.8, speechy = true) {
  const n = Math.max(4, Math.floor(w / 2));
  let d = '';
  for (let i = 0; i < n; i++) {
    const env = speechy ? (0.35 + 0.65 * Math.abs(Math.sin(i / (5 + density * 3)))) : (0.75 + 0.25 * Math.sin(i / 40));
    const a = Math.max(0.04, env * level * (0.35 + rnd() * 0.65)) * (h / 2 - 2);
    const x = (i / n) * w;
    d += `M${x.toFixed(1)} ${(h / 2 - a).toFixed(1)}V${(h / 2 + a).toFixed(1)}`;
  }
  return `<svg width="${w}" height="${h}" class="absolute inset-0"><path d="${d}" stroke="${color}" stroke-width="1.1"/></svg>`;
}

// ---------- timeline geometry ----------
const T0 = 36, T1 = 52;              // window shown: 0:36 – 0:52
const HEAD = 200, LW = 1500 - 24 - HEAD - 2; // lane area width
const x = (t) => ((t - T0) / (T1 - T0)) * LW;
const PLAY = 42.3;
const fmt = (t) => { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(2).padStart(5, '0')}`; };

const ORIG = [[36.2, 38.9], [39.4, 41.5], [41.85, 44.6], [45.2, 47.9], [48.4, 51.6]];
const DUB = [
  [36.25, 39.1, '10', 'मुझे नहीं पता था', '#818cf8'],
  [39.45, 41.6, '11', 'कि यह इतना आसान है', '#38bdf8'],
  [41.85, 44.9, '12', 'जब आप भीतर देखते हैं', '#a78bfa', true],
  [45.25, 48.0, '13', 'सब कुछ बदल जाता है', '#818cf8'],
  [48.4, 51.7, '14', 'और यही असली यात्रा है', '#38bdf8'],
];

function ruler() {
  let s = '';
  for (let t = T0; t <= T1; t += 1) {
    const big = t % 2 === 0;
    s += `<div class="absolute bottom-0 border-l ${big ? 'h-2.5 border-slate-500' : 'h-1.5 border-slate-700'}" style="left:${x(t)}px"></div>`;
    if (big) s += `<span class="absolute top-0.5 mono text-[10px] text-slate-500" style="left:${x(t) + 3}px">0:${String(t).padStart(2, '0')}</span>`;
  }
  return `<div class="relative h-6 border-b edge bg-slate-950/40">${s}</div>`;
}

function clip(t0, t1, top, h, color, label, opts = {}) {
  const l = x(t0), w = x(t1) - x(t0);
  const bg = opts.ghost ? 'transparent' : color + '26';
  const border = opts.ghost ? `2px dashed ${color}` : `1px solid ${color}88`;
  return `<div class="absolute rounded-[4px] overflow-hidden ${opts.cls || ''}" style="left:${l}px;width:${w}px;top:${top}px;height:${h}px;background:${bg};border:${border};${opts.pick ? 'box-shadow:0 0 0 2px #a5b4fc;' : ''}">
    ${opts.noWave ? '' : wave(w, h, color + (opts.ghost ? '88' : 'cc'), opts.density || 1, opts.level || 0.8, opts.speechy !== false)}
    <span class="absolute left-1.5 top-0.5 text-[10.5px] font-medium text-slate-100/95 truncate" style="max-width:${w - 10}px;text-shadow:0 1px 2px #000">${label}</span>
    ${opts.tag ? `<span class="absolute right-1.5 bottom-0.5 mono text-[9.5px] text-slate-300/80">${opts.tag}</span>` : ''}
  </div>`;
}

function trackHead({ name, color, sub, rename, mute, solo, level = 0.62, menu = true, cls = '', h = 56 }) {
  return `<div class="px-2 flex flex-col justify-center gap-1 border-b edge ${cls}" style="height:${h}px">
    <div class="flex items-center gap-1.5 min-w-0">
      <span class="w-2 h-2 rounded-sm shrink-0" style="background:${color}"></span>
      <span class="text-[12px] font-medium truncate ${rename ? 'px-1 rounded border border-indigo-400 bg-slate-950 text-white' : 'text-slate-200'}">${name}${rename ? '<span class="inline-block w-px h-3 bg-white ml-px align-middle animate-pulse"></span>' : ''}</span>
      <span class="ml-auto flex items-center gap-1">
        <span class="ms ${mute ? 'bg-slate-200 text-slate-900' : ''}">M</span><span class="ms ${solo ? 'bg-amber-300 text-slate-900' : ''}">S</span>
        ${menu ? `<span class="text-slate-500">${ic('dots', 14)}</span>` : ''}
      </span>
    </div>
    ${sub ? `<span class="text-[10px] text-slate-500 truncate">${sub}</span>` : ''}
    <div class="flex items-center gap-1.5"><div class="fader"><i style="left:${level * 100}%"></i></div><span class="mono text-[9.5px] text-slate-500 w-9 text-right">${level === 0.62 ? '0.0 dB' : (level > 0.62 ? '+' : '') + ((level - 0.62) * 30).toFixed(1) + ' dB'}</span></div>
  </div>`;
}

// ---------- the Edit timing shell ----------
function shell({ extraTools = '', chips = '', heads, lanes, overlay = '', minH = 0 }) {
  return `
  <div class="relative flex flex-col gap-3 rounded-xl border edge bg-slate-950/70 p-3" style="background:#0a0d14;min-height:${minH}px">
    <div class="flex flex-wrap items-center gap-2">
      <h3 class="text-[13.5px] font-semibold">Edit timing</h3>
      <span class="chip bg-amber-400/10 text-amber-300">3 lines edited by hand</span>
      <span class="chip bg-emerald-500/15 text-emerald-300">26 of 26 in sync</span>
      ${chips}
      <span class="flex items-center gap-1.5 text-[11.5px] text-slate-400">${ic('check', 14, 'text-emerald-400')} Audio up to date</span>
      <span class="ml-auto flex items-center gap-1.5">
        <span class="btn">${ic('reset', 14)} Reset all edits</span>
        <span class="btn pri">${ic('check', 14)} Done</span>
      </span>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <div class="grp">
        <span class="tool">${ic('mic')} Select range</span>
        <span class="tool">${ic('scissors')} Blade</span>
        <span class="tool on">${ic('magnet')} Snap</span>
        <span class="tool">${ic('ripple')} Ripple</span>
        <span class="tool">${ic('flag')} Marker</span>
      </div>
      ${extraTools}
      <div class="grp"><span class="tool !px-2">${ic('undo')}</span><span class="tool !px-2">${ic('redo')}</span><span class="tool">${ic('hist')} History</span></div>
      <div class="grp ml-auto"><span class="tool !px-2 opacity-40">${ic('zout')}</span><span class="mono text-[11px] text-slate-400 self-center px-2">16 s</span><span class="tool !px-2">${ic('zin')}</span><span class="tool">${ic('maxi', 14)} Fit</span></div>
      <span class="grp"><span class="tool">Wave ×1</span></span>
      <span class="grp"><span class="tool">${ic('help')} Shortcuts</span></span>
    </div>
    <div class="flex items-center gap-3 min-h-[2.75rem] rounded-xl border edge bg-slate-950/60 px-3 text-[12.5px] text-slate-400">
      <span class="font-medium text-slate-200">Click a line to pick it</span> · right-click it for everything it can do · double-click it for its start, speed, gain and fades.
    </div>
    <div class="grid rounded-xl border edge overflow-hidden" style="grid-template-columns:${HEAD}px minmax(0,1fr);background:#0d121b">
      <div class="flex flex-col text-[11px] text-slate-400 border-r edge">
        <div class="h-6 px-2 flex items-center mono text-[11px] font-semibold text-slate-200 border-b edge">${fmt(PLAY)}</div>
        ${trackHead({ name: 'Original', color: '#22d3ee', menu: false, sub: '' }).replace('M</span>', 'M</span>')}
        <div class="h-6 px-2 flex items-center text-[10.5px] text-slate-500 border-b edge">Sync links</div>
        ${trackHead({ name: 'Hindi dub', color: '#818cf8', h: 72 })}
        ${heads}
        <div class="h-6 px-2 flex items-center text-[10.5px] text-slate-500 border-b edge">Script</div>
        <div class="h-10 px-2 flex items-center text-[10.5px] text-slate-500">Start drift</div>
      </div>
      <div class="relative min-w-0 select-none" style="overflow:hidden">
        ${ruler()}
        <div class="relative h-14 border-b edge">${ORIG.map(([a, b]) => clip(a, b, 6, 44, '#22d3ee', '')).join('')}</div>
        <div class="relative h-6 border-b edge">${ORIG.map(([a], n) => `<div class="absolute top-1 bottom-1 w-px bg-slate-600" style="left:${x(a)}px"></div><div class="absolute top-1 bottom-1 w-px bg-slate-600" style="left:${x(DUB[n][0])}px"></div>`).join('')}</div>
        <div class="relative border-b edge" style="height:72px">${DUB.map(([a, b, id, text, c, pick]) => clip(a, b, 6, 60, c, `${id} · ${text}`, { pick })).join('')}</div>
        ${lanes}
        <div class="relative h-6 border-b edge">${DUB.map(([a, b, id, text]) => `<span class="absolute top-1 text-[10.5px] text-slate-400 truncate" style="left:${x(a) + 4}px;max-width:${x(b) - x(a) - 8}px">${text}</span>`).join('')}</div>
        <div class="relative h-10">${DUB.map(([a]) => `<span class="absolute top-3 mono text-[10px] text-emerald-400/80" style="left:${x(a) + 4}px">+0.0${Math.floor(rnd() * 9)} s</span>`).join('')}</div>
        <div class="absolute top-0 bottom-0 w-[1.5px] bg-rose-500 z-20" style="left:${x(PLAY)}px"><div class="absolute -top-0 -left-[5px] w-3 h-3 bg-rose-500" style="clip-path:polygon(0 0,100% 0,50% 100%)"></div></div>
        ${overlay}
      </div>
    </div>
  </div>`;
}

// ---------- Mock A: tracks under the dub + an Add track row ----------
function mockA() {
  seed = 11;
  const heads = `
    <div class="new" style="margin:2px">
      ${trackHead({ name: 'Music', color: '#34d399', sub: 'intro-music.wav · 48 kHz stereo', level: 0.48 })}
      ${trackHead({ name: 'Effects', color: '#e879f9', sub: 'bell.wav', level: 0.62 })}
      <div class="h-9 px-2 flex items-center border-b edge">
        <span class="w-full h-7 rounded-lg border border-dashed border-slate-600 text-slate-300 text-[11.5px] flex items-center justify-center gap-1.5">${ic('plus', 13)} Add track</span>
      </div>
    </div>`;
  const lanes = `
    <div class="relative h-14 border-b edge" style="margin-top:2px">${clip(36, 52, 6, 44, '#34d399', 'intro-music.wav', { speechy: false, level: 0.55, tag: '−6.0 dB · fade in 1.2 s' })}
      <div class="absolute top-[6px] h-[44px] w-[60px] pointer-events-none" style="left:0;background:linear-gradient(90deg,#0d121bdd,transparent)"></div>
    </div>
    <div class="relative h-14 border-b edge">
      ${clip(44.75, 46.5, 6, 44, '#e879f9', 'bell.wav', { density: .4 })}
      ${clip(49.2, 50.9, 6, 44, '#e879f9', 'bell.wav', { density: .4, ghost: true })}
      <div class="absolute z-30 text-[11px] rounded-md px-2 py-1 bg-slate-900 border border-slate-600 text-slate-200 mono whitespace-nowrap" style="left:${x(49.2) - 196}px;top:14px">drops at 0:49.20 · 1.70 s →</div>
      <div class="absolute z-30 flex items-center gap-1.5 text-[11px] rounded-md px-2 py-1 bg-slate-800 border border-slate-500 text-slate-100 shadow-lg whitespace-nowrap" style="left:${x(49.9)}px;top:34px">${ic('fileaudio', 13)} bell.wav</div>
    </div>
    <div class="relative h-9 border-b edge flex items-center justify-center text-[11px] text-slate-500 bg-[repeating-linear-gradient(135deg,#0d121b_0_10px,#101622_10px_20px)]">Drop an audio file here for a new track</div>`;
  return shell({ heads, lanes, chips: `<span class="chip bg-emerald-400/10 text-emerald-300 new">2 extra tracks</span>` });
}

// ---------- Mock B: Add audio button → centred window ----------
function mockB() {
  seed = 23;
  const heads = trackHead({ name: 'Music', color: '#34d399', sub: 'intro-music.wav', level: 0.48 });
  const lanes = `<div class="relative h-14 border-b edge">${clip(36, 52, 6, 44, '#34d399', 'intro-music.wav', { speechy: false, level: 0.55 })}</div>`;
  const extraTools = `<div class="grp new"><span class="tool on">${ic('fileaudio')} Add audio</span></div>`;
  const win = `
  <div class="absolute inset-0 z-50 flex items-start justify-center pt-16" style="background:#02040acc">
    <div class="w-[660px] rounded-2xl border border-slate-700 bg-[#0e131c] shadow-2xl shadow-black/60 new">
      <div class="flex items-center gap-2 px-5 pt-4 pb-3 border-b edge">
        ${ic('fileaudio', 18, 'text-slate-300')}<h4 class="text-[15px] font-semibold">Add audio</h4>
        <span class="ml-auto text-slate-500">${ic('x', 18)}</span>
      </div>
      <div class="px-5 py-4 flex flex-col gap-4">
        <div class="rounded-xl border edge bg-[#0a0e15] p-3">
          <div class="flex items-center gap-2">
            <span class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-slate-200">${ic('play', 14)}</span>
            <div class="min-w-0">
              <div class="text-[13px] font-medium text-slate-100">bell.wav</div>
              <div class="mono text-[11px] text-slate-500">1.70 s · 44.1 kHz · stereo · 24-bit</div>
            </div>
            <span class="ml-auto btn">${ic('upload', 13)} Choose another file</span>
          </div>
          <div class="relative h-14 mt-2.5 rounded-md overflow-hidden" style="background:#e879f91a">${wave(616, 56, '#e879f9cc', .4)}</div>
          <p class="mt-2 text-[11.5px] text-amber-300/90">The dub is 48 kHz: this file will be resampled to 48 kHz to play in it. Nothing else changes in it.</p>
        </div>

        <div>
          <div class="text-[10.5px] uppercase tracking-wider font-semibold text-slate-500 mb-1.5">Put it on</div>
          <div class="grid grid-cols-3 gap-2">
            <div class="radio sel"><span class="dot"></span><span><b class="text-slate-100 font-medium">A new track</b><br><span class="text-[11px] text-slate-400">named <span class="px-1 rounded bg-slate-800 text-slate-200">Effects</span></span></span></div>
            <div class="radio"><span class="dot"></span><span><b class="text-slate-100 font-medium">Music</b><br><span class="text-[11px] text-slate-400">a track you have</span></span></div>
            <div class="radio"><span class="dot"></span><span><b class="text-slate-100 font-medium">Line 12 as a take</b><br><span class="text-[11px] text-slate-400">a voice someone recorded</span></span></div>
          </div>
        </div>

        <div>
          <div class="text-[10.5px] uppercase tracking-wider font-semibold text-slate-500 mb-1.5">Starts at</div>
          <div class="grid grid-cols-3 gap-2">
            <div class="radio sel"><span class="dot"></span><span><b class="text-slate-100 font-medium">The playhead</b><br><span class="mono text-[11px] text-slate-400">0:42.30</span></span></div>
            <div class="radio"><span class="dot"></span><span><b class="text-slate-100 font-medium">Line 12's start</b><br><span class="mono text-[11px] text-slate-400">0:41.85</span></span></div>
            <div class="radio"><span class="dot"></span><span><b class="text-slate-100 font-medium">The beginning</b><br><span class="mono text-[11px] text-slate-400">0:00.00</span></span></div>
          </div>
        </div>

        <div class="flex items-center gap-3 text-[12.5px] text-slate-300">
          <span class="w-12 text-slate-400">Level</span>
          <div class="fader !h-1"><i style="left:62%"></i></div>
          <span class="mono text-[12px] w-16 text-right">0.0 dB</span>
        </div>
      </div>
      <div class="flex items-center gap-2 px-5 py-3 border-t edge">
        <span class="text-[11.5px] text-slate-500">Sync again leaves it where you put it.</span>
        <span class="ml-auto btn">Cancel</span>
        <span class="btn pri">${ic('plus', 14)} Add</span>
      </div>
    </div>
  </div>`;
  return shell({ heads, lanes, extraTools, minH: 760 }).replace(/<\/div>\s*$/, win + '</div>');
}

// ---------- page ----------
const tabs = document.getElementById('tabs');
let cur = 'A';
function render() {
  tabs.innerHTML = MOCKS.map((m) => `<button data-id="${m.id}" class="px-3 py-1 ${m.id === cur ? 'bg-indigo-500/25 text-indigo-100' : 'text-slate-400 hover:text-slate-200'}">${m.name}</button>`).join('');
  const m = MOCKS.find((v) => v.id === cur);
  document.getElementById('note').innerHTML = m.note;
  document.getElementById('stage').innerHTML = m.html();
  document.getElementById('after').innerHTML = COMMON;
  fit();
}
tabs.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { cur = b.dataset.id; render(); } });
document.getElementById('marks').addEventListener('change', (e) => document.body.classList.toggle('hide-new', !e.target.checked));
function fit() {
  const wrap = document.getElementById('wrap'), stage = document.getElementById('stage');
  const s = Math.min(1, wrap.clientWidth / 1500);
  stage.style.transform = `scale(${s})`;
  wrap.style.height = stage.scrollHeight * s + 'px';
}
window.addEventListener('resize', fit);
render();
</script>

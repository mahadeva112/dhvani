<style>

  .tb { position:relative; height:28px; min-width:28px; padding:0 6px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; gap:5px; font-size:12px; color:#cbd5e1; cursor:default; }
  .tb:hover { background:#1e293b; color:#fff; }
  .tb.on { background:#312e81; color:#e0e7ff; }
  .tb .tip { display:none; position:absolute; top:calc(100% + 6px); left:50%; transform:translateX(-50%); z-index:60; white-space:nowrap; background:#020617; border:1px solid #334155; border-radius:8px; padding:4px 8px; font-size:11px; color:#e2e8f0; font-weight:400; }
  .tb:hover .tip { display:block; }
  .ws { height:28px; padding:0 9px; border-radius:8px; display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#94a3b8; cursor:default; border:1px solid transparent; }

  .seg span.on { background:#24262d; color:#f1f5f9; }
  .tab { padding:6px 14px; font-size:13px; color:#94a3b8; cursor:default; }
  .tab.on { background:#1e2230; color:#f1f5f9; }
  .clip { position:absolute; top:4px; bottom:4px; border-radius:3px; overflow:hidden; cursor:default; }
  .clip.pick { box-shadow:0 0 0 2px #f1f5f9; z-index:3; }
  .scroll::-webkit-scrollbar { width:9px; height:9px; } .scroll::-webkit-scrollbar-thumb { background:#2a2d35; border-radius:8px; }

  .lbl { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; color:#64748b; }
  .feat td { padding:4px 6px; vertical-align:top; border-top:1px solid #1d2028; }
  .hatch { background-image: repeating-linear-gradient(135deg, #f59e0b55 0 4px, transparent 4px 8px); }
  .hatchR { background-image: repeating-linear-gradient(135deg, #fb718555 0 4px, transparent 4px 8px); }
  .step { border:1px solid #232a36; border-radius:10px; background:#0f1014; }
  .step.go { border-color:#6366f180; background:#6366f10f; }
  .num { width:18px; height:18px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; background:#1e293b; color:#cbd5e1; flex-shrink:0; }
  .step.go .num { background:#6366f1; color:#fff; }
  /* DaVinci-style splitters: drag to resize, double-click to reset */
  .split { position:relative; flex-shrink:0; z-index:20; }
  .split.x { width:8px; cursor:col-resize; } .split.y { height:8px; cursor:row-resize; }
  .split::after { content:''; position:absolute; border-radius:2px; background:#232a36; transition:background .12s; }
  .split.x::after { top:0; bottom:0; left:3.5px; width:1px; } .split.y::after { left:0; right:0; top:3.5px; height:1px; }
  .split:hover::after, .split.drag::after { background:#818cf8; }
  .split.x:hover::after, .split.x.drag::after { width:2px; left:3px; } .split.y:hover::after, .split.y.drag::after { height:2px; top:3px; }
  .split .grip { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; gap:2px; pointer-events:none; }
  .split.x .grip { flex-direction:column; }

  .split:hover .grip i, .split.drag .grip i { background:#c7d2fe; }

  .lrz:hover, .lrz.drag { background:#818cf855; }
  .meter { background:linear-gradient(to top,#22c55e 0%,#22c55e 65%,#eab308 82%,#ef4444 100%); }
  body.dragging, body.dragging * { user-select:none !important; }

// ---------- data: the screenshot's dub, two speakers ----------

// ---------- the timeline: lanes resize by their bottom edge ----------
function timeline({ from = 0, to = SPAN, small = false } = {}) {
  const span = to - from, p = (t) => ((t - from) / span) * 100;

  const flags = L.map((l, i) => prob(i) && inView(l) ? `<span data-act="pick:${i}" title="${reason(l)}" class="absolute top-[3px] h-[18px] px-1.5 rounded-[4px] border text-[10.5px] font-medium leading-[16px] whitespace-nowrap cursor-default ${flagCls(l)} ${S.pick === i ? 'ring-2 ring-white/80' : ''}" style="left:${p(l.t)}%">${flagTxt(l)}</span>` : '').join('');
  const markers = MARKERS.filter((m) => m.t > from && m.t < to).map((m) => `<span class="absolute top-[4px] flex items-center gap-1 text-[10.5px] text-sky-200 whitespace-nowrap" style="left:${p(m.t)}%"><span class="w-2 h-2 rotate-45 bg-sky-400"></span>${m.n}</span>`).join('');
  const lane = (sp) => {
    const rooms = L.map((l, i) => {
      if (l.sp !== sp || !prob(i) || l.st === 'silent' || !inView(l)) return '';
      const over = l.st === 'long' ? l.d - l.o : l.by;
      return `<div class="absolute top-[2px] bottom-[2px] rounded-[3px] border border-dashed border-slate-400/50 bg-slate-400/[0.06] pointer-events-none" style="left:${p(l.t)}%;width:${(l.o / span) * 100}%"></div><div class="absolute top-[2px] bottom-[2px] hatch pointer-events-none z-[4]" style="left:${p(l.t + l.o)}%;width:${(Math.max(over, 0.35) / span) * 100}%"></div>`;
    }).join('');
    const clips = L.map((l, i) => {
      if (l.sp !== sp || !inView(l)) return '';
      const pk = S.pick === i ? ' pick' : '';

      const c = DUBC[i % 4];
      return `<div class="clip${pk}" style="left:${p(l.t + (l.off || 0))}%;width:${(l.d / span) * 100}%;background:${c}2e;border:1px solid ${c}aa" data-act="pick:${i}">${wave(i + 40, c)}<span class="absolute right-1 top-1 w-1.5 h-1.5 rounded-full bg-amber-400"></span></div>`;
    }).join('');
    return rooms + clips;
  };
  const music = [[0, 44], [52, 92]].filter(([a, b]) => b > from && a < to).map(([a, b], k) => `<div class="clip" style="left:${p(a)}%;width:${((b - a) / span) * 100}%;background:#f472b622;border:1px solid #f472b680">${wave(90 + k, '#f472b6aa', 160)}</div>`).join('');
  const step = span > 60 ? 10 : 5;
  const ticks = Array.from({ length: Math.ceil(span / step) + 1 }, (_, k) => from - (from % step) + k * step).filter((t) => t >= from && t <= to).map((t) => `<span class="absolute top-0 h-full border-l edge pl-1 text-[10px] mono text-slate-500" style="left:${p(t)}%">${clock(t).replace('.0', '')}</span>`).join('');
  const head = (color, name, sub, ms) => `<div class="h-full px-2 flex flex-col justify-center gap-1 min-w-0 overflow-hidden">
      <span class="flex items-center gap-1.5 text-[11.5px] text-slate-200 min-w-0"><span class="w-2 h-2 rounded-sm shrink-0" style="background:${color}"></span><span class="truncate">${name}</span><span class="ml-auto text-[10px] text-slate-500 shrink-0">${sub}</span></span>

      ${row(px('l1'), head('#818cf8', 'Speaker 1', '10 lines', true), lane(1), 'l1')}

      <div class="absolute top-0 bottom-0 w-px bg-rose-500 pointer-events-none z-[6]" style="left:calc(${W} + (100% - ${W}) * ${Math.min(Math.max(ph, 0), 100) / 100})"></div>

  </div>`;
}

const VIEWS = {
  E1: { f: viewE1, note: '<b>E1 · Resolve Edit পাতা।</b> ওপরে বাঁয়ে Review video, ডানে Inspector (Line · Takes · Mixer), নিচে পুরো চওড়া Timeline, তাতে Edit timing-এর সব টুল সবসময় থাকে, আলাদা mode নয়। ভিডিও আর Inspector-এর মাঝের দাগ টানলে চওড়া বদলায়, ওপর আর Timeline-এর মাঝের দাগ টানলে উচ্চতা বদলায়। ওপরের <b>Video / Inspector</b> বোতামে প্যানেল লুকোনো যায়, তখন Timeline সেই জায়গাও পায়। প্রতিটা প্যানেলের ⤢ চাপলে সেটা পুরো পাতা জুড়ে খোলে।' },
  E2: { f: viewE2, note: '<b>E2 · Fairlight (শব্দের কাজের পাতা)।</b> মাঝখানে Timeline সবচেয়ে বড়। বাঁয়ে <b>Index</b>: শোনার মতো ৩টা লাইন, Markers, আর পুরো Lines উইন্ডো খোলার বোতাম। ডানে <b>Inspector</b>: Line আর Takes। নিচে <b>Mixer</b>: প্রতি বক্তার fader, M/S, মিটার, Mix check, Even out speakers, Stems। তিনটে দাগই টানা যায়, তিনটে প্যানেলই ওপরের বোতামে লুকোনো যায়।' },
  E3: { f: viewE3, note: '<b>E3 · Cut পাতা।</b> ওপরে পুরো ডাবের ছোট মানচিত্র: সমস্যার জায়গায় ত্রিভুজ, সাদা বাক্সে এখন কোন অংশ দেখছ। তার নিচে <b>Now playing</b> ব্যান্ড: লাইনটা বড় করে, দুপাশে আগের আর পরের লাইন, আর ঠিক করার ধাপগুলো। সবচেয়ে নিচে বড় করা Timeline (৪০ সেকেন্ড)। ডানে Inspector, চারটে ট্যাবে। মানচিত্র, ব্যান্ড আর Inspector-এর দাগ টেনে মাপ বদলানো যায়।' },
  E4: { f: viewE4, note: '<b>E4 · Focus।</b> Timeline প্রায় পুরো পাতা জুড়ে। Inspector ডানে আটকানো, তার বাঁদিকের দাগ টেনে চওড়া বদলায়। <b>Takes</b> (<kbd>T</kbd>) নিচে একটা ড্রয়ারে খোলে, ওপরের দাগ টেনে উঁচু-নিচু করা যায়। Review video ভাসমান ছোট জানালা, কোণ ধরে টেনে বড় করা যায়। সব প্যানেল লুকোলে পুরো পাতা শুধু লেন।' },
};
const FEAT = [
  ['Sync result: verdict + সব সংখ্যা (hover)', { E1: 'app bar', E2: 'app bar', E3: 'app bar', E4: 'app bar' }],
  ['খবর: preset পরামর্শ, Fit-এর ফল, 2 changed, take to choose, no audio', { E1: 'এক সারি', E2: 'এক সারি', E3: 'এক সারি', E4: 'এক সারি' }],
  ['⏮ ▶ ⏭, সময়, 1× / 0.75×', { E1: 'transport', E2: 'transport', E3: 'transport', E4: 'transport' }],
  ['Undo voice change, Undo/Redo/History', { E1: 'transport', E2: 'transport', E3: 'transport', E4: 'transport' }],
  ['3 to listen + Next mark N', { E1: 'transport', E2: 'transport + Index', E3: 'transport + মানচিত্র', E4: 'transport' }],
  ['Select range, Blade, Snap, Ripple, Marker', { E1: 'Timeline টুল', E2: 'Timeline টুল', E3: 'Timeline টুল', E4: 'Timeline টুল' }],
  ['Split, Join, Align, Mute, Lock, Split at pauses, Tighten, Takes', { E1: 'Timeline টুল', E2: 'Timeline টুল', E3: 'Timeline টুল', E4: 'Timeline টুল' }],
  ['Markers', { E1: 'Markers সারি', E2: 'সারি + Index', E3: 'সারি + Index ট্যাব', E4: 'সারি + Index ট্যাব' }],
  ['Original, Sync check, বক্তার লেন (M/S/level), ট্র্যাক', { E1: 'Timeline', E2: 'Timeline', E3: 'Timeline', E4: 'Timeline' }],
  ['Wave ×1/×2/×4, zoom, Whole track, ছোট মানচিত্র', { E1: 'transport + নিচে', E2: 'transport + নিচে', E3: 'মানচিত্র প্যানেল', E4: 'transport + নিচে' }],
  ['বাছা লাইন: Start, Speed, Gain, Fades, Lock, Align, Reset', { E1: 'Inspector → Line', E2: 'Inspector → Line', E3: 'Inspector → Line', E4: 'Inspector → Line' }],
  ['লাইন, কারণ, বার, ঠিক করার ৫ ধাপ, Shorten বক্স', { E1: 'Inspector → Line', E2: 'Inspector → Line', E3: 'ব্যান্ড + Inspector', E4: 'Inspector → Line' }],
  ['Takes: wave + শব্দ, Say instead, takes, Use, Place, tags, stability, More takes', { E1: 'Inspector → Takes', E2: 'Inspector → Takes', E3: 'Inspector → Takes', E4: 'নিচের ড্রয়ার' }],
  ['Review video (pop out)', { E1: 'ভিডিও প্যানেল', E2: 'Video বোতাম → ভাসমান', E3: 'Video বোতাম → ভাসমান', E4: 'ভাসমান জানালা' }],
  ['Speakers: fader, Mix check, Even out speakers, Stems', { E1: 'Inspector → Mixer', E2: 'Mixer প্যানেল', E3: 'Inspector → Mixer', E4: 'Inspector → Mixer' }],
  ['Voices: Voice and delivery, Cast, Change the voice', { E1: 'Voices উইন্ডো', E2: 'Voices উইন্ডো', E3: 'Voices উইন্ডো', E4: 'Voices উইন্ডো' }],
  ['Sync settings, Sync again ▾ (Changed only, From scratch)', { E1: 'app bar', E2: 'app bar', E3: 'app bar', E4: 'app bar' }],
  ['Export ▾: WAV/MP3, Dub + tracks, stems, Subtitles, Script', { E1: 'Export উইন্ডো', E2: 'Export উইন্ডো', E3: 'Export উইন্ডো', E4: 'Export উইন্ডো' }],
  ['Lines: tabs, Retake these/all, notes, every line', { E1: 'Inspector → Index → উইন্ডো', E2: 'Index → উইন্ডো', E3: 'Index ট্যাব → উইন্ডো', E4: 'Index ট্যাব → উইন্ডো' }],
  ['প্যানেল টেনে ছোট-বড়, দুবার ক্লিকে ফেরে, ⤢ পুরো পাতা', { E1: '২টা দাগ + লেন', E2: '৩টা দাগ + লেন', E3: '৩টা দাগ + লেন', E4: '২টা দাগ + লেন + ভিডিওর কোণ' }],
];
function render() {
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map((k) => `<span data-act="view:${k}" class="tab ${S.view === k ? 'on' : ''}">${k}</span>`).join('');
  document.getElementById('note').innerHTML = VIEWS[S.view].note;
  const fr = document.getElementById('frame');
  fr.innerHTML = appBar() + noticeRow() + `<div class="flex-1 min-h-0 flex flex-col">${VIEWS[S.view].f()}</div>` + windows();
  for (const [k, v] of Object.entries(SZ)) fr.style.setProperty(`--${k}`, `${v}px`);
  document.getElementById('feat').innerHTML = FEAT.map(([f, m]) => `<tr><td class="text-emerald-400">${I('check', 'w-3.5 h-3.5')}</td><td class="text-slate-300">${f}</td><td class="text-slate-400 text-right">${m[S.view]}</td></tr>`).join('');
  measure();
}
function measure() { const el = document.querySelector('#frame [data-lanes]'); document.getElementById('hgt').textContent = el ? `timeline ${Math.round(el.getBoundingClientRect().height)} px` : ''; }
function nextMark() { const k = REVIEW.indexOf(S.pick); S.pick = REVIEW[(k + 1) % REVIEW.length]; S.box = S.sugg = false; }

// clicks
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const stop = e.target.closest('[data-stop]');
  if (stop && a.contains(stop)) return;
  const [n, v] = a.dataset.act.split(':');
  if (n === 'view') { S.view = v; S.max = null; S.win = null; S.box = S.sugg = false; }
  else if (n === 'pick') { const i = +v; if (i !== S.pick) { S.box = S.sugg = false; } S.pick = i; if (S.tab === 'mixer' || S.tab === 'index') S.tab = 'line'; }
  else if (n === 'panel') { S.panels[S.view][v] = !S.panels[S.view][v]; S.max = null; }
  else if (n === 'max') S.max = S.max === v ? null : v;
  else if (n === 'tab') S.tab = v; else if (n === 'ltab') S.ltab = v; else if (n === 'lineN') S.lineN = +v;
  else if (n === 'win') S.win = v || null;
  else if (n === 'takes') { if (S.view === 'E4') S.panels.E4.takes = !S.panels.E4.takes; else S.tab = S.tab === 'takes' ? 'line' : 'takes'; }
  else if (n === 'nextmark') nextMark();
  else if (n === 'notice') S.notice = false;
  else if (['sugg', 'box'].includes(n)) S[n] = !S[n];
  else return;
  e.stopPropagation();
  render();
});
// keys
document.addEventListener('keydown', (e) => {
  if (e.target.closest('textarea,input')) return;
  const k = e.key.toLowerCase();
  if (k === 'n') nextMark();
  else if (k === 't') { if (S.view === 'E4') S.panels.E4.takes = !S.panels.E4.takes; else S.tab = S.tab === 'takes' ? 'line' : 'takes'; }
  else if (k === 'e') S.box = !S.box;
  else if (k === 'i' && 'insp' in S.panels[S.view]) S.panels[S.view].insp = !S.panels[S.view].insp;
  else if (k === 'escape') { S.win = null; S.max = null; }
  else return;
  render();
});
// DaVinci-style dragging: splitters and lane edges
let drag = null;
document.addEventListener('pointerdown', (e) => {
  const s = e.target.closest('[data-split]');
  if (!s) return;
  e.preventDefault();
  const key = s.dataset.split;
  drag = { key, el: s, dir: s.dataset.dir === 'x' ? 'x' : 'y', sign: +s.dataset.sign || 1, start: s.dataset.dir === 'x' ? e.clientX : e.clientY, v: SZ[key] };
  s.classList.add('drag'); document.body.classList.add('dragging');
  document.body.style.cursor = drag.dir === 'x' ? 'col-resize' : 'row-resize';
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const d = (drag.dir === 'x' ? e.clientX : e.clientY) - drag.start;
  const [lo, hi] = LIM[drag.key];
  SZ[drag.key] = Math.round(Math.min(hi, Math.max(lo, drag.v + d * drag.sign)));
  document.getElementById('frame').style.setProperty(`--${drag.key}`, `${SZ[drag.key]}px`);
  measure();
});
document.addEventListener('pointerup', () => { if (!drag) return; drag.el.classList.remove('drag'); document.body.classList.remove('dragging'); document.body.style.cursor = ''; drag = null; });
document.addEventListener('dblclick', (e) => { const s = e.target.closest('[data-split]'); if (!s) return; SZ[s.dataset.split] = DEF[s.dataset.split]; render(); });
document.getElementById('notice').addEventListener('change', (e) => { S.notice = e.target.checked; render(); });
window.addEventListener('resize', measure);
render();
</script>
